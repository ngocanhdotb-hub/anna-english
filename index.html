const NAV_ITEMS = [
  { key: "home", href: "#/home", label: "Trang chủ", icon: "home" },
  { key: "path", href: "#/path", label: "Lộ trình", icon: "book" },
  { key: "train", href: "#/train", label: "Luyện tập", icon: "mic" },
  { key: "friends", href: "#/friends", label: "Bạn bè", icon: "smile" },
  { key: "me", href: "#/me", label: "Cá nhân", icon: "user" }
];
const NAV_GROUP = { level: "path", topic: "path", quiz: "path", vocab: "train", dialog: "train", friend: "friends", rank: "friends", notices: "friends", history: "me", settings: "me" };
function renderNav(active) {
  $("#navLinks").innerHTML = NAV_ITEMS.map((n) =>
    `<a class="link" href="${n.href}" ${n.key === active ? 'aria-current="page"' : ""}>${ic(n.icon)}${n.label}</a>`).join("");
}
let currentRoute = { name: "", learning: false };
let routeTicket = 0;
function route() {
  routeTicket++;
  closeSheet();
  cleanupPractice();
  cleanupDialog();
  Speech.cancel();
  if (!me) return;
  const [name = "home", a, b, c] = location.hash.replace(/^#\/?/, "").split("/").map((x) => decodeURIComponent(x));
  const leavingPractice = currentRoute.name === "practice" && name !== "practice";
  V = null;
  if (leavingPractice) {
    if (practiceSessionReps >= 3) toast(`Buổi luyện tốt lắm! Bạn vừa nói thêm ${practiceSessionReps} lần.`);
    practiceSessionReps = 0; autoRun = false; lessonSeen = new Set();
  }
  const vocabSession = name === "vocab" && a;
  const learning = name === "practice" || name === "dialog" || vocabSession;
  if (learning || name === "quiz") document.body.dataset.focus = "1"; else delete document.body.dataset.focus;
  const sameScreen = currentRoute.name === name && name === "practice";
  currentRoute = { name, learning: !!learning };
  renderNav(NAV_GROUP[name] || name || "home");
  switch (name) {
    case "": case "home": renderHome(); break;
    case "path": renderPath(); break;
    case "level": renderLevel(a); break;
    case "topic": renderFinish(a); break;
    case "train": renderTrain(); break;
    case "practice": renderPractice(a, b, c); break;
    case "vocab": a ? renderVocabSession(a) : renderVocabHome(); break;
    case "quiz": renderQuiz(a, b); break;
    case "dialog": renderDialog(a); break;
    case "friends": renderFriends(); break;
    case "friend": renderFriend(a); break;
    case "rank": renderRank(); break;
    case "notices": renderNotices(); break;
    case "me": renderMe(); break;
    case "history": renderHistory(); break;
    case "settings": renderSettings(); break;
    default: view.innerHTML = notFound();
  }
  if (!sameScreen) { window.scrollTo(0, 0); view.focus({ preventScroll: true }); }
}
window.addEventListener("hashchange", route);

let lastActive = Date.now();
const markActive = () => { lastActive = Date.now(); };
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, markActive, { passive: true }));
let unsentSeconds = 0;
function sendStudyTime() {
  if (!me || unsentSeconds < 1) return;
  const s = unsentSeconds;
  unsentSeconds = 0;
  Outbox.push("add_study_time", { p_seconds: s });
}
setInterval(() => {
  if (!me || !currentRoute.learning || document.hidden || Date.now() - lastActive > 90000) return;
  unsentSeconds++;
  if (unsentSeconds >= 30) sendStudyTime();
}, 1000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  sendStudyTime();
  if (P) {
    if (P.mic === "recording") stopMic();
    Speech.cancel();
    stopPlayback();
    pauseIfActive();
  }
  if (D && !["ready", "paused", "done", "error", "manual"].includes(D.phase)) { dStop(); dSetPhase("paused"); }
});
window.addEventListener("pagehide", () => { sendStudyTime(); cleanupDialog(); Recog.stop(); Mic.stop(true); Speech.cancel(); });

/* ============================================================
   PHẦN 11: KHỞI ĐỘNG
   ============================================================ */
let signedInUser = null;
async function enterApp(user) {
  signedInUser = user;
  view.innerHTML = loadingView();
  try {
    await loadMe(user.id);
    if (!me) throw new Error("no profile");
    await loadContent();
    Outbox.load();
    await Outbox.flush();
    await loadProgress();
    const unread = await sb.from("notifications").select("id", { count: "exact", head: true }).eq("user_id", me.id).is("read_at", null);
    unreadNotices = unread.count || 0;
    listenNotifications();
    // Lỡ nghỉ thì tự dùng thẻ giữ chuỗi; học đủ 7 ngày thì được tặng thẻ
    try {
      const st = await rpc("sync_streak");
      me.streak_freezes = st.freezes;
      if (st.used) toast(`🛡️ Đã dùng ${st.used} thẻ để giữ chuỗi ${st.streak} ngày của bạn.`);
      else if (st.awarded) toast("🛡️ Bạn được tặng 1 thẻ giữ chuỗi!");
    } catch (e) { /* không ảnh hưởng việc học */ }
    route();
  } catch (e) {
    me = null;
    document.body.dataset.focus = "1";
    view.innerHTML = `<div class="card empty screen"><div class="big">📡</div><p class="subtitle">Chưa kết nối được máy chủ</p>
      <p class="muted" style="margin-bottom:14px">${esc(errorText(e))}</p><button class="btn btn-primary" onclick="location.reload()">Thử lại</button></div>`;
  }
}
function leaveApp() {
  signedInUser = null;
  me = null;
  routeTicket++;
  cleanupPractice();
  cleanupDialog();
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  state.sp = {}; state.words = {};
  levelRows = {}; topicRows = {};
  authMode = "login";
  renderAuth();
}
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
loadPrefs();
applyScale();
Speech.init();
if (!window.supabase) {
  document.body.dataset.focus = "1";
  view.innerHTML = `<div class="card empty"><div class="big">📡</div><p class="subtitle">Chưa tải được ứng dụng</p><p class="muted" style="margin-bottom:14px">Hãy kiểm tra Internet rồi tải lại trang.</p><button class="btn btn-primary" onclick="location.reload()">Tải lại</button></div>`;
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "annaEnglish.auth" } });
  // Gọi hàm Supabase bên trong sự kiện này có thể gây treo, nên đẩy sang lượt chạy sau
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      const user = session && session.user;
      if (user && (!signedInUser || signedInUser.id !== user.id)) enterApp(user);
      else if (!user && (signedInUser || event === "INITIAL_SESSION")) leaveApp();
    }, 0);
  });
}
</script>
