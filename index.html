<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F1">
<meta name="description" content="Anna English – Luyện nói tiếng Anh giao tiếp mỗi ngày cho người Việt mới bắt đầu.">
<title>Anna English – Luyện nói tiếng Anh mỗi ngày</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23C2412D'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='20' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<!-- Font Be Vietnam Pro; nếu không tải được sẽ tự dùng font hệ thống trong --font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PHẦN GIAO DIỆN (CSS) – thiết kế theo Mobile-first
   ============================================================ */
:root {
  --font: "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --bg: #FFF8F1;
  --surface: #FFFFFF;
  --ink: #1F2A37;
  --muted: #566070;
  --line: #EFE3D6;
  --primary: #C2412D;
  --primary-dark: #A33422;
  --primary-soft: #FDEBE4;
  --good: #0B6B63;
  --good-soft: #DCF3EE;
  --warn: #8A5300;
  --warn-soft: #FFF1D6;
  --danger: #B42318;
  --danger-soft: #FDE7E4;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 1px 2px rgba(80, 50, 30, .05), 0 6px 20px rgba(80, 50, 30, .06);
  --nav-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
html[data-scale="lg"] { font-size: 112.5%; }
html[data-scale="xl"] { font-size: 125%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.5 var(--font); overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; border-radius: 6px; }
svg.ic { width: 1.4em; height: 1.4em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Khung ứng dụng */
#view { padding: 16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; outline: none; }
.screen { animation: fadeUp .22s ease-out; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }

/* Thanh điều hướng: dưới cùng trên điện thoại, cột trái trên desktop */
#nav {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
#nav .brand { display: none; }
#nav .links { display: grid; grid-template-columns: repeat(4, 1fr); }
#nav a.link {
  min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: .8125rem; font-weight: 500; color: var(--muted); position: relative;
}
#nav a.link[aria-current="page"] { color: var(--primary); font-weight: 700; }
#nav a.link[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; background: var(--primary); border-radius: 0 0 4px 4px;
}
body[data-focus] #nav { display: none; }
body[data-focus] #view { padding-bottom: 0; }

/* Thành phần chung */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.title { font-size: 1.5rem; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; }
.subtitle { font-size: 1.0625rem; font-weight: 700; }
.page-head { padding: 6px 2px 14px; }

.btn {
  min-height: 48px; padding: 10px 18px; border-radius: 14px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .6; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(194, 65, 45, .28); }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-soft { background: var(--primary-soft); color: var(--primary-dark); }
.btn-ghost { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px #D9C8B6; }
.btn-good { background: var(--good); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-lg { min-height: 56px; font-size: 1.0625rem; }
.btn-block { width: 100%; }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn:hover { background: rgba(0, 0, 0, .04); }

.bar { height: 10px; background: #F3E7DA; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s ease; }
.bar.good > i { background: var(--good); }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: .8125rem; font-weight: 600; white-space: nowrap; }
.tag svg.ic { width: 1.1em; height: 1.1em; }
.tag-new { background: #F2EBE3; color: var(--muted); }
.tag-doing { background: var(--warn-soft); color: var(--warn); }
.tag-done { background: var(--good-soft); color: var(--good); }

.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: .9375rem; }
.notice b { display: block; }
.notice-warn { background: var(--warn-soft); color: #5F3A00; }
.notice-bad { background: var(--danger-soft); color: #7A1A12; }
.notice-good { background: var(--good-soft); color: #084C46; }

.empty { text-align: center; padding: 36px 20px; }
.empty .big { font-size: 2.75rem; line-height: 1; margin-bottom: 10px; }

/* Thông báo nhanh, đặt phía trên để không che vùng ngón cái */
#toasts { position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: grid; justify-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: .9375rem; max-width: 460px; box-shadow: 0 8px 24px rgba(0, 0, 0, .22); animation: toastIn .22s ease-out; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } }

/* Bảng trượt từ dưới lên */
dialog#sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 86vh; border-radius: 24px 24px 0 0; background: var(--surface); color: var(--ink); }
dialog#sheet::backdrop { background: rgba(31, 42, 55, .45); }
dialog#sheet[open] { animation: sheetUp .22s ease-out; }
@keyframes sheetUp { from { transform: translateY(30px); opacity: .4; } }
.sheet-body { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.sheet-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; min-height: 56px; border-radius: 14px; }
.sheet-item:hover { background: var(--bg); }
.sheet-item[aria-current="true"] { background: var(--primary-soft); }
.sheet-item .no { width: 30px; height: 30px; border-radius: 50%; background: #F3E7DA; display: grid; place-items: center; font-size: .875rem; font-weight: 700; flex: none; }
.sheet-item .no.ok { background: var(--good); color: #fff; }
.sheet-item .txt { flex: 1; min-width: 0; font-weight: 600; }
.guide-step { display: flex; gap: 12px; align-items: flex-start; }
.guide-step .no { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); display: grid; place-items: center; font-weight: 800; flex: none; }

/* --- Trang chủ --- */
.home-grid { display: grid; gap: 14px; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 2px; }
.hero h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.25; }
.streak { display: flex; flex-direction: column; align-items: center; padding: 6px 12px; background: var(--warn-soft); color: #5F3A00; border-radius: 16px; flex: none; }
.streak b { font-size: 1.25rem; line-height: 1.2; }
.streak span { font-size: .75rem; font-weight: 600; white-space: nowrap; }
.resume { background: var(--ink); color: #fff; }
.resume .eyebrow { font-size: .875rem; font-weight: 600; opacity: .85; }
.resume .topic-line { font-size: 1.125rem; font-weight: 700; margin-top: 2px; }
.resume .sent { margin: 6px 0 14px; opacity: .9; }
.goal { display: flex; align-items: center; gap: 16px; }
.ring { width: 76px; height: 76px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .tr { stroke: #F3E7DA; }
.ring .fg { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
.ring.ok .fg { stroke: var(--good); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1rem; font-weight: 800; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 12px 8px; text-align: center; min-width: 0; }
.tile b { display: block; font-size: 1.5rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile span { display: block; font-size: .8125rem; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.quote { background: var(--primary-soft); box-shadow: none; }
.quote .en { font-size: 1.125rem; font-weight: 700; }
.challenge-link { display: flex; align-items: center; gap: 12px; }
.challenge-link .ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn); flex: none; }
.challenge-link .grow { flex: 1; min-width: 0; }

/* --- Thẻ chủ đề --- */
.topic-grid { display: grid; gap: 12px; }
.topic-card { display: block; transition: transform .12s ease, box-shadow .12s ease; width: 100%; text-align: left; }
.topic-card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(80, 50, 30, .06), 0 10px 26px rgba(80, 50, 30, .1); }
.topic-ico { width: 52px; height: 52px; background: var(--primary-soft); border-radius: 16px; display: grid; place-items: center; font-size: 1.625rem; flex: none; }
.topic-card h3 { font-size: 1.0625rem; font-weight: 700; line-height: 1.3; }

/* --- Màn hình luyện câu --- */
.pr-head { display: flex; align-items: center; gap: 4px; margin: -8px -8px 2px; }
.pr-head .mid { flex: 1; min-width: 0; text-align: center; }
.pr-head .tn { font-size: .875rem; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-jump { display: inline-flex; align-items: center; gap: 2px; min-height: 28px; font-weight: 700; }
.pr-jump svg.ic { width: 1.05em; height: 1.05em; }
.pr-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-bottom: 150px; }
#speakPanel { scroll-margin-bottom: 150px; }
.sentence { text-align: center; padding: 6px 4px 0; }
.sentence .en { font-size: 2.25rem; font-weight: 800; line-height: 1.2; letter-spacing: -.015em; overflow-wrap: anywhere; }
.sentence .en.long { font-size: 1.75rem; }
.sentence .vi { margin-top: 6px; font-size: 1.0625rem; color: var(--muted); min-height: 1.6em; }
.toggle-vi { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 2px 10px; font-size: .875rem; font-weight: 600; color: var(--muted); }
.hint { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--primary-soft); color: #6E2415; font-weight: 600; font-size: .9375rem; }
.hint.done { background: var(--good-soft); color: #084C46; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #F5ECE2; border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-width: 0; min-height: 42px; border-radius: 10px; font-size: .875rem; font-weight: 600; color: var(--muted); padding: 2px 4px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.rec-line { display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: var(--danger); }
.rec-dot { width: 11px; height: 11px; background: var(--danger); border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
canvas.meter { width: 100%; height: 64px; display: block; background: #FBF4EC; border-radius: 12px; }
.meter-status { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; min-height: 26px; text-align: center; }
.meter-status[data-s="low"] { color: var(--primary-dark); }
.meter-status[data-s="good"] { color: var(--good); }
.meter-status[data-s="quiet"] { color: var(--muted); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-mic { min-height: 60px; font-size: 1.125rem; }
.btn-mic svg.ic { width: 1.6em; height: 1.6em; }

.dock {
  position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(80, 50, 30, .07);
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
}
.dock-in { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }
.count-row { display: flex; align-items: center; gap: 10px; }
.count { font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.count small { font-size: .875rem; font-weight: 600; color: var(--muted); }
.count.pop { animation: pop .25s ease; }
@keyframes pop { 40% { transform: scale(1.25); } }
.count-row .bar { flex: 1; }
.dock-btns { display: grid; grid-template-columns: 68px minmax(0, 1fr) 68px; gap: 8px; }
.nav-side { min-height: 60px; border-radius: 14px; font-size: .75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; padding: 2px; box-shadow: inset 0 0 0 1.5px var(--line); }
.nav-side:disabled { opacity: .4; }
.nav-side.is-next { background: var(--good); color: #fff; box-shadow: none; }
.plus { min-height: 60px; font-size: 1.125rem; }
.plus-idle { background: var(--ink); color: #fff; }
.plus-soft { background: #F2EBE3; color: var(--ink); }

/* --- Luyện nói tự động: mỗi trạng thái có màu và biểu tượng riêng --- */
.status { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 700; text-align: center; }
.st-idle { background: #F2EBE3; color: var(--ink); }
.st-model { background: #E4ECFD; color: #1E3A8A; }
.st-turn { background: var(--primary); color: #fff; }
.st-listen { background: var(--primary-soft); color: #6E2415; box-shadow: inset 0 0 0 2px var(--primary); }
.st-listen svg.ic { animation: pulse 1.1s infinite; }
.st-near { background: var(--warn-soft); color: #5F3A00; }
.st-wrong { background: #F5E6F2; color: #6B2160; }
.st-good { background: var(--good); color: #fff; animation: pop .3s ease; }
.st-move { background: var(--good-soft); color: #084C46; }
.st-pause { background: #E9EDF2; color: var(--ink); }
.st-bad { background: var(--danger-soft); color: #7A1A12; }
.sentence .ipa { margin-top: 2px; color: var(--muted); font-family: "Segoe UI", "Lucida Sans Unicode", "Noto Sans", "DejaVu Sans", var(--font); }
.live { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
canvas.wave { width: 100%; height: 44px; display: block; background: #FBF4EC; border-radius: 12px; }
.fake-wave { height: 44px; display: flex; align-items: center; justify-content: center; gap: 5px; background: #FBF4EC; border-radius: 12px; }
.fake-wave i { width: 5px; height: 10px; border-radius: 3px; background: var(--primary); opacity: .35; }
.fake-wave.on i { opacity: 1; animation: waveBar .8s ease-in-out infinite; }
.fake-wave i:nth-child(2) { animation-delay: .1s; } .fake-wave i:nth-child(3) { animation-delay: .2s; }
.fake-wave i:nth-child(4) { animation-delay: .3s; } .fake-wave i:nth-child(5) { animation-delay: .4s; }
@keyframes waveBar { 50% { height: 32px; } }
.interim { min-height: 1.5em; text-align: center; font-size: 1.0625rem; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.compare { display: grid; gap: 6px; font-size: .9375rem; }
.compare b { display: block; font-size: .8125rem; font-weight: 600; color: var(--muted); }
.compare span { font-weight: 600; overflow-wrap: anywhere; }
.lesson-dock .tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tool { min-height: 58px; border-radius: 14px; font-size: .8125rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; box-shadow: inset 0 0 0 1.5px var(--line); }
.tool:disabled { opacity: .4; }
.lesson-pad { padding-bottom: 110px; }
.first-note { text-align: center; font-size: .875rem; color: var(--muted); }

/* --- Flashcard --- */
.fc-scene { perspective: 1200px; }
.fc { display: grid; width: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, .7, .3, 1); cursor: pointer; animation: fadeUp .25s ease-out; }
.fc.flipped { transform: rotateY(180deg); }
.fc-face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); min-height: 320px; padding: 22px 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px;
}
.fc-back { transform: rotateY(180deg); }
.fc .word { font-size: 2.5rem; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; letter-spacing: -.01em; }
.fc .ipa { font-family: "Segoe UI", "Lucida Sans Unicode", "Noto Sans", "DejaVu Sans", var(--font); font-size: 1.25rem; color: var(--muted); }
.fc .mean { font-size: 1.75rem; font-weight: 800; color: var(--primary-dark); }
.fc .ex { font-size: 1.125rem; font-weight: 600; }
.fc-pad { padding-bottom: 104px; display: grid; gap: 12px; }
.dock-simple .two .btn { min-height: 60px; }

/* --- Thử thách --- */
.timer { text-align: center; font-size: 3rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--danger); }
.ch-stats { display: flex; justify-content: center; gap: 18px; font-weight: 600; color: var(--muted); font-size: .9375rem; }
.ch-stats b { color: var(--ink); }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; min-height: 64px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); }
.choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--primary); background: var(--primary-soft); font-weight: 700; }
.choice .topic-ico { width: 44px; height: 44px; font-size: 1.375rem; border-radius: 12px; background: var(--bg); }
.result-num { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* --- Tiến độ & biểu đồ 7 ngày --- */
.chart { position: relative; height: 150px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; padding-bottom: 24px; }
.chart .col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-radius: 6px; outline-offset: 0; }
.chart .fill { width: min(26px, 70%); background: var(--primary); border-radius: 4px 4px 0 0; min-height: 0; }
.chart .fill.zero { height: 2px !important; background: var(--line); border-radius: 2px; }
.chart .lb { position: absolute; bottom: -24px; font-size: .75rem; color: var(--muted); line-height: 24px; }
.chart .col.today .lb { color: var(--ink); font-weight: 700; }
.chart .val { font-size: .75rem; font-weight: 700; line-height: 1.5; }
/* Tooltip chỉ chiếm chỗ khi hiện; cột nửa trái canh trái, cột nửa phải canh phải để không tràn màn hình */

/* Chuyển dữ liệu bản cũ (đếm 20 lần): câu đủ 20 lần coi như đã hoàn thành, câu đang dở coi như đang học */
function migrate(data) {
  if (data.spMigrated) return data;
  Object.entries(data.sentences || {}).forEach(([k, reps]) => {
    if (data.sp[k]) return;
    data.sp[k] = reps >= 20
      ? { status: "done", attempts: 0, successes: 1, firstResult: "legacy", completedAt: Date.now(), seconds: 0, lastHeard: "", review: false }
      : { status: "doing", attempts: 0, successes: 0, firstResult: null, completedAt: null, seconds: 0, lastHeard: "", review: false };
  });
  data.spMigrated = true;
  return data;
}

let storageOk = true;
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const data = JSON.parse(raw);
    if (!data || typeof data !== "object") return defaultState();
    return migrate(Object.assign(defaultState(), data));
  } catch (e) {
    // Trình duyệt chặn bộ nhớ hoặc dữ liệu hỏng: chạy với dữ liệu trống thay vì để ứng dụng lỗi
    storageOk = isStorageWritable();
    return defaultState();
  }
}
function isStorageWritable() {
  try {
    localStorage.setItem(STORE_KEY + ".test", "1");
    localStorage.removeItem(STORE_KEY + ".test");
    return true;
  } catch (e) { return false; }
}
let state = loadState();
if (!isStorageWritable()) storageOk = false;

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    storageOk = true;
  } catch (e) { storageOk = false; }
}

/* Ngày theo giờ địa phương của máy, không dùng UTC để tránh lệch ngày ở Việt Nam */
const dateKey = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const daysAgo = (n) => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate() - n); };
const dayData = (key = dateKey()) => state.days[key] || { seconds: 0, reps: 0 };
function todayRecord() {
  const key = dateKey();
  if (!state.days[key]) state.days[key] = { seconds: 0, reps: 0 };
  return state.days[key];
}

const topicById = (id) => TOPICS.find((t) => t.id === id);
const sKey = (tid, i) => `${tid}:${i}`;
const repsOf = (tid, i) => state.sentences[sKey(tid, i)] || 0;
const isKnown = (tid, i) => (state.words[sKey(tid, i)] || {}).status === "known";
const totalSentences = () => TOPICS.reduce((n, t) => n + t.sentences.length, 0);
const totalWords = () => TOPICS.reduce((n, t) => n + t.words.length, 0);
const spOf = (tid, i) => state.sp[sKey(tid, i)] || null;
const isDone = (tid, i) => !!(spOf(tid, i) && spOf(tid, i).completedAt);
const needsReview = (tid, i) => { const r = spOf(tid, i); return !!r && (r.review || r.status === "review"); };
/* Câu còn phải học: chưa hoàn thành và chưa bị bỏ qua sang danh sách ôn */
const isOpen = (tid, i) => { const r = spOf(tid, i); return !r || (!r.completedAt && r.status !== "review"); };
const reviewList = (t) => t.sentences.map((_, i) => i).filter((i) => needsReview(t.id, i))
  .sort((a, b) => (spOf(t.id, b).attempts || 0) - (spOf(t.id, a).attempts || 0));
const doneInTopic = (t) => t.sentences.filter((_, i) => isDone(t.id, i)).length;
const topicHref = (t) => {
  const i = t.sentences.findIndex((_, x) => isOpen(t.id, x));
  return i >= 0 ? `#/practice/${t.id}/${i}` : `#/finish/${t.id}`;
};
const knownInTopic = (t) => t.words.filter((_, i) => isKnown(t.id, i)).length;
const doneTotal = () => TOPICS.reduce((n, t) => n + doneInTopic(t), 0);
const knownTotal = () => TOPICS.reduce((n, t) => n + knownInTopic(t), 0);
const learningWords = () => {
  const list = [];
  TOPICS.forEach((t) => t.words.forEach((_, i) => {
    if ((state.words[sKey(t.id, i)] || {}).status === "learning") list.push({ t, i });
  }));
  return list;
};
function topicPercent(t) {
  if (!t.sentences.length) return 0;
  return Math.round(doneInTopic(t) / t.sentences.length * 100);
}
function topicStatus(t) {
  if (t.sentences.length && doneInTopic(t) === t.sentences.length) return "done";
  const touched = t.sentences.some((_, i) => spOf(t.id, i) || repsOf(t.id, i) > 0) || t.words.some((_, i) => state.words[sKey(t.id, i)]);
  return touched ? "doing" : "new";
}
function overallPercent() {
  const units = totalSentences() + totalWords();
  return units ? Math.round((doneTotal() + knownTotal()) / units * 100) : 0;
}
/* Chuỗi ngày chỉ còn hiệu lực nếu học hôm nay hoặc hôm qua */
function currentStreak() {
  if (state.lastStudyDate === dateKey() || state.lastStudyDate === dateKey(daysAgo(1))) return state.streak;
  return 0;
}
/* Gọi mỗi khi có hoạt động học thật sự: cập nhật chuỗi ngày và ngày học gần nhất */
function recordActivity() {
  const today = dateKey();
  if (state.lastStudyDate === today) return;
  state.streak = state.lastStudyDate === dateKey(daysAgo(1)) ? state.streak + 1 : 1;
  state.lastStudyDate = today;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  if (state.streak >= 2) toast(`🔥 Bạn đã học ${state.streak} ngày liên tiếp!`);
}
function addRep(t, i) {
  const k = sKey(t.id, i);
  const count = (state.sentences[k] || 0) + 1;
  state.sentences[k] = count;
  todayRecord().reps++;
  state.totalReps++;
  recordActivity();
  save();
  return count;
}
/* Trao huy hiệu một lần duy nhất khi hoàn thành tất cả các câu của chủ đề */
function awardBadgeIfNew(t) {
  if (doneInTopic(t) === t.sentences.length && t.sentences.length && !state.badges[t.id]) {
    state.badges[t.id] = dateKey();
    save();
    return true;
  }
  return false;
}
/* Nơi người học nên quay lại: câu đang dở, rồi câu chưa học, rồi câu cần ôn */
function resumeTarget() {
  if (!TOPICS.length) return null;
  const last = state.last && topicById(state.last.topicId);
  if (last && last.sentences[state.last.index]) {
    if (isOpen(last.id, state.last.index)) return { t: last, i: state.last.index, started: true };
    const next = last.sentences.findIndex((_, i) => isOpen(last.id, i));
    if (next >= 0) return { t: last, i: next, started: true };
  }
  for (const t of TOPICS) {
    const i = t.sentences.findIndex((_, x) => isOpen(t.id, x));
    if (i >= 0) return { t, i, started: !!state.last };
  }
  return { t: TOPICS[0], i: 0, started: true, allDone: true };
}

/* ============================================================
   PHẦN 2B: CHẤM CÂU NÓI
   So sánh theo từ (Levenshtein), từ gần giống chỉ tính một phần lỗi,
   và luôn kiểm tra từ khóa để không chấp nhận câu thiếu ý.
   ============================================================ */
const NUMBER_WORDS = { 0: "zero", 1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six", 7: "seven", 8: "eight", 9: "nine", 10: "ten", 11: "eleven", 12: "twelve", 20: "twenty" };
const CONTRACTIONS = {
  "i'm": "i am", "you're": "you are", "we're": "we are", "they're": "they are", "he's": "he is", "she's": "she is", "it's": "it is",
  "what's": "what is", "where's": "where is", "here's": "here is", "that's": "that is", "how's": "how is",
  "don't": "do not", "doesn't": "does not", "can't": "can not", "cannot": "can not", "isn't": "is not", "aren't": "are not",
  "i'd": "i would", "i'll": "i will", "you'll": "you will", "we'll": "we will", "i've": "i have", "o'clock": ""
};
/* Từ đồng âm: bộ nhận diện không phân biệt được nên không tính là lỗi của người học */
const HOMOPHONES = {
  meat: "meet", two: "to", too: "to", buy: "by", bye: "by", sea: "see", sun: "son", their: "there", they: "they", hear: "here", blew: "blue",
  won: "one", wear: "where", hour: "our", ate: "eight", sum: "some", write: "right", red: "red", read: "red", four: "for", tea: "tea"
};
const STOP_WORDS = new Set(["a", "an", "the", "is", "am", "are", "to", "at", "in", "of", "by", "do", "does", "and", "very", "please", "i", "it", "this", "you", "your", "my", "our", "we"]);
function normalizeSpeech(text) {
  let t = String(text).toLowerCase().replace(/[’‘`]/g, "'");
  t = t.replace(/\b(\d{1,2}):00\b/g, "$1").replace(/\bt\.?\s?v\.?(?=\s|$)/g, "tv");
  t = t.replace(/\bgood bye\b/g, "goodbye").replace(/\bviet nam\b/g, "vietnam").replace(/\bo clock\b/g, "");
  t = t.split(/\s+/).map((w) => {
    const clean = w.replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
    return CONTRACTIONS[clean] !== undefined ? CONTRACTIONS[clean] : clean;
  }).join(" ");
  t = t.replace(/\b\d+\b/g, (n) => NUMBER_WORDS[n] || n).replace(/[^a-z0-9\s]/g, " ");
  return t.split(/\s+/).filter(Boolean).map((w) => (w === "goodbye" ? w : HOMOPHONES[w] || w));
}
function charDistance(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}
/* Từ khác nhau từ một nửa số chữ trở lên được tính là sai hẳn một từ */
function wordCost(a, b) {
  if (a === b) return 0;
  const ratio = charDistance(a, b) / Math.max(a.length, b.length);
  return ratio >= 0.5 ? 1 : ratio;
}
/* Sai từ không mang nghĩa (a, the, my…) chỉ tính nửa lỗi; nếu không, câu ngắn sai một từ nhỏ sẽ không bao giờ đạt mức "gần đúng" */
const wordWeight = (w) => (STOP_WORDS.has(w) ? 0.5 : 1);
function wordSimilarity(said, target) {
  const row = [0];
  for (let j = 1; j <= target.length; j++) row[j] = row[j - 1] + wordWeight(target[j - 1]);
  for (let i = 1; i <= said.length; i++) {
    let prev = row[0];
    row[0] += wordWeight(said[i - 1]);
    for (let j = 1; j <= target.length; j++) {
      const tmp = row[j];
      const swap = wordCost(said[i - 1], target[j - 1]) * wordWeight(target[j - 1]);
      row[j] = Math.min(row[j] + wordWeight(said[i - 1]), row[j - 1] + wordWeight(target[j - 1]), prev + swap);
      prev = tmp;
    }
  }
  const longest = Math.max(said.length, target.length);
  return longest ? 1 - row[target.length] / longest : 0;
}
function missingKeywords(said, sentence, targetWords) {
  const keys = sentence.keywords ? sentence.keywords.flatMap(normalizeSpeech) : targetWords.filter((w) => !STOP_WORDS.has(w));
  return keys.filter((k) => !said.some((w) => w === k || (k.length > 3 && wordCost(w, k) <= 0.25)));
}
/* Kết quả: { level: "correct" | "near" | "wrong", score } */
function gradeSpeech(text, sentence) {
  const said = normalizeSpeech(text);
  const main = normalizeSpeech(sentence.en);
  const accepted = [main, ...(sentence.accepts || []).map(normalizeSpeech)];
  if (accepted.some((w) => w.join(" ") === said.join(" ") && w.length)) return { level: "correct", score: 1 };
  const score = wordSimilarity(said, main);
  const missing = missingKeywords(said, sentence, main);
  if (score >= 0.95 && !missing.length) return { level: "correct", score };
  if (score >= 0.85 && !missing.length) return { level: "near", score };
  return { level: "wrong", score };
}

/* --- Phát giọng mẫu bằng SpeechSynthesis --- */
const Speech = {
  supported: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  voice: null, finish: null, utter: null,
  init() {
    if (!this.supported) return;
    this.pickVoice();
    try { speechSynthesis.addEventListener("voiceschanged", () => this.pickVoice()); } catch (e) { /* trình duyệt cũ */ }
  },
  pickVoice() {
    const voices = speechSynthesis.getVoices() || [];
    const us = voices.filter((v) => (v.lang || "").replace("_", "-").toLowerCase() === "en-us");
    const score = (v) => (v.localService ? 2 : 0) + (/samantha|aria|jenny|google us|natural/i.test(v.name) ? 3 : 0);
    this.voice = us.sort((a, b) => score(b) - score(a))[0] || null;
  },
  /* Trả về Promise với kết quả: ended | canceled | error | unsupported. onState báo trạng thái để cập nhật nút */
  speak(text, rate, onState = () => {}) {
    if (!this.supported) { onState("idle"); return Promise.resolve("unsupported"); }
    this.cancel();
    return new Promise((resolve) => {
      let done = false, startTimer, guardTimer, delay;
      const finish = (result) => {
        if (done) return;
        done = true;
        clearTimeout(startTimer); clearTimeout(guardTimer); clearTimeout(delay);
        if (this.finish === finish) this.finish = null;
        onState("idle");
        resolve(result);
      };
      this.finish = finish;
      onState("loading");
      const u = new SpeechSynthesisUtterance(text);
      this.utter = u; // giữ tham chiếu vì Chrome có thể thu hồi và không phát sự kiện kết thúc
      u.lang = "en-US";
      u.rate = rate;
      if (this.voice) u.voice = this.voice;
      u.onstart = () => {
        clearTimeout(startTimer);
        onState("playing");
        guardTimer = setTimeout(() => finish("ended"), 20000);
      };
      u.onend = () => finish("ended");
      u.onerror = (e) => finish(e.error === "interrupted" || e.error === "canceled" ? "canceled" : "error");
      // Chờ một nhịp sau cancel() vì một số trình duyệt bỏ qua lệnh speak() gọi ngay sau đó
      delay = setTimeout(() => {
        try {
          speechSynthesis.resume();
          speechSynthesis.speak(u);
          startTimer = setTimeout(() => { try { speechSynthesis.cancel(); } catch (e) {} finish("error"); }, 6000);
        } catch (e) { finish("error"); }
      }, 60);
    });
  },
  cancel() {
    if (!this.supported) return;
    if (this.finish) this.finish("canceled");
    try { speechSynthesis.cancel(); } catch (e) {}
  }
};

/* --- Micro: đo âm lượng bằng AnalyserNode và ghi âm bằng MediaRecorder --- */
const Mic = {
  session: null,
  canUseMic: () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
  canMeasure: () => !!(window.AudioContext || window.webkitAudioContext),
  canRecord: () => typeof window.MediaRecorder === "function",
  pickMime() {
    if (!MediaRecorder.isTypeSupported) return "";
    return ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"]
      .find((m) => MediaRecorder.isTypeSupported(m)) || "";
  },
  /* cb gồm: onLive({ measuring, recording }), onLevel(0..1), onDone({ url }), onError(mã lỗi) */
  async start(cb) {
    if (this.session) return;
    if (!this.canUseMic()) { cb.onError(window.isSecureContext === false ? "insecure" : "unsupported"); return; }
    const session = { cb, cancelled: false, stream: null, ctx: null, rec: null, chunks: [], raf: 0, discard: false };
    this.session = session;
    let stream;
    try {
      // Chỉ xin quyền micro tại đây, tức là sau khi người dùng đã bấm "Nói theo"
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
      });
    } catch (e) {
      if (session.cancelled) return;
      this.session = null;
      const map = {
        NotAllowedError: "denied", PermissionDeniedError: "denied", SecurityError: "denied",
        NotFoundError: "nomic", DevicesNotFoundError: "nomic", OverconstrainedError: "nomic",
        NotReadableError: "busy", TrackStartError: "busy", AbortError: "busy"
      };
      cb.onError(map[e && e.name] || "unknown");
      return;
    }
    // Người dùng đã rời màn hình trong lúc chờ cấp quyền: trả micro ngay
    if (session.cancelled) { stream.getTracks().forEach((tr) => tr.stop()); return; }
    session.stream = stream;

    const live = { measuring: false, recording: false };
    try { live.measuring = this.startMeter(session); } catch (e) { live.measuring = false; }
    try { live.recording = cb.meterOnly ? false : this.startRecorder(session); } catch (e) { live.recording = false; }
    cb.onLive(live);
  },
  startMeter(session) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    const ctx = new Ctx();
    session.ctx = ctx;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    // Không nối tới loa để tránh tiếng vọng
    ctx.createMediaStreamSource(session.stream).connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);
    const loop = () => {
      if (this.session !== session) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; sum += x * x; }
      const rms = Math.sqrt(sum / buf.length);
      // Đổi sang decibel rồi quy về 0–1: −55 dB là im lặng, −15 dB là rất to
      const db = 20 * Math.log10(rms || 1e-6);
      session.cb.onLevel(Math.max(0, Math.min(1, (db + 55) / 40)));
      session.raf = requestAnimationFrame(loop);
    };
    loop();
    return true;
  },
  startRecorder(session) {
    if (!this.canRecord()) return false;
    const mime = this.pickMime();
    const rec = mime ? new MediaRecorder(session.stream, { mimeType: mime }) : new MediaRecorder(session.stream);
    session.rec = rec;
    rec.ondataavailable = (e) => { if (e.data && e.data.size) session.chunks.push(e.data); };
    rec.onstop = () => {
      if (session.discard) return;
      if (!session.chunks.length) { session.cb.onDone({ url: null }); return; }
      const blob = new Blob(session.chunks, { type: rec.mimeType || mime || "audio/webm" });
      session.cb.onDone({ url: URL.createObjectURL(blob) });
    };
    rec.start();
    return true;
  },
  /* Dừng và giải phóng toàn bộ micro + AudioContext. discard = true nếu bỏ bản ghi */
  stop(discard = false) {
    const session = this.session;
    if (!session) return;
    this.session = null;
    session.cancelled = true;
    session.discard = discard;
    cancelAnimationFrame(session.raf);
    const hadRecorder = session.rec && session.rec.state !== "inactive";
    if (hadRecorder) { try { session.rec.stop(); } catch (e) {} }
    if (session.stream) session.stream.getTracks().forEach((tr) => tr.stop());
    if (session.ctx && session.ctx.state !== "closed") session.ctx.close().catch(() => {});
    if (!hadRecorder && !discard && session.stream) session.cb.onDone({ url: null });
  }
};

/* --- Nhận diện giọng nói: bảo đảm mỗi lúc chỉ có MỘT phiên chạy --- */
const Recog = {
  Ctor: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  current: null, pending: null, releaseTimer: 0,
  get supported() { return !!this.Ctor; },
  /* cb gồm: onSpeech(), onInterim(text), onFinal([các phương án]), onError(mã), onEnd() */
  start(cb) {
    this.pending = cb;
    if (this.current) {
      this.stop();
      // Phòng khi trình duyệt không báo onend sau khi hủy phiên
      clearTimeout(this.releaseTimer);
      this.releaseTimer = setTimeout(() => { this.current = null; this.runPending(); }, 600);
      return;
    }
    this.runPending();
  },
  runPending() {
    const cb = this.pending;
    this.pending = null;
    if (!cb) return;
    const r = new this.Ctor();
    r.lang = "en-US";
    r.continuous = false;       // một lượt nói; trình duyệt tự kết thúc khi người học ngừng nói
    r.interimResults = true;
    r.maxAlternatives = 4;
    const session = { r, cb, dead: false };
    this.current = session;
    r.onspeechstart = r.onsoundstart = () => { if (!session.dead) cb.onSpeech(); };
    r.onresult = (e) => {
      if (session.dead) return;
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          const alts = [];
          for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
          session.dead = true;      // chống chấm trùng khi trình duyệt báo nhiều kết quả cuối
          cb.onFinal(alts);
          return;
        }
        interim += res[0].transcript;
      }
      if (interim) cb.onInterim(interim);
    };
    r.onerror = (e) => { if (!session.dead && e.error !== "aborted") cb.onError(e.error); };
    r.onend = () => {
      const wasCurrent = this.current === session;
      if (wasCurrent) { this.current = null; clearTimeout(this.releaseTimer); }
      if (!session.dead) { session.dead = true; cb.onEnd(); }
      if (wasCurrent) this.runPending();
    };
    try { r.start(); }
    catch (e) { this.current = null; session.dead = true; cb.onError("start-failed"); }
  },
  /* Hủy phiên hiện tại, kết quả đến muộn sẽ bị bỏ qua */
  stop() {
    this.pending = null;
    const s = this.current;
    if (!s) return;
    s.dead = true;
    try { s.r.abort(); } catch (e) {}
  }
};
/* Trên điện thoại micro thường chỉ phục vụ được một nơi, nên không đo âm lượng song song với nhận diện */

/* Hiệu ứng pháo giấy nhẹ, không chạy nếu người dùng tắt chuyển động */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70";
  c.width = innerWidth; c.height = innerHeight;
  document.body.appendChild(c);
  const g = c.getContext("2d");
  const colors = ["#C2412D", "#F2A541", "#0B6B63", "#FDEBE4"];
  const parts = Array.from({ length: 70 }, () => ({
    x: c.width / 2, y: c.height * .45,
    vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 3,
    s: 5 + Math.random() * 5, r: Math.random() * 6, col: colors[Math.floor(Math.random() * 4)]
  }));
  const start = performance.now();
  (function frame(now) {
    const t = now - start;
    g.clearRect(0, 0, c.width, c.height);
    g.globalAlpha = Math.max(0, 1 - t / 1500);
    parts.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.vy += .32; p.r += .15;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col;
      g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore();
    });
    if (t < 1500) requestAnimationFrame(frame); else c.remove();
  })(start);
}

function sayFromButton(btn, text, rate) {
  const icon = btn.querySelector("[data-icon]");
  const label = btn.querySelector("[data-label]");
  const baseLabel = label ? label.dataset.base || (label.dataset.base = label.textContent) : "";
  if (!Speech.supported) { toast(SPEECH_UNSUPPORTED); return; }
  Speech.speak(text, rate, (s) => {
    if (!btn.isConnected) return;
    if (label) label.textContent = s === "loading" ? "Đang chuẩn bị…" : s === "playing" ? "Đang phát…" : baseLabel;
    if (icon) icon.innerHTML = s === "playing" ? ic("sound") : ic("play");
    btn.setAttribute("aria-busy", s === "idle" ? "false" : "true");
  }).then((r) => { if (r === "error") toast(SPEECH_FAILED); });
}

function setPhase(phase) {

/* Hẹn giờ gắn với lượt chạy hiện tại: bị hủy tự động khi lượt đó kết thúc */
function later(fn, ms) {
  const owner = P, run = P.run;
  const id = setTimeout(() => { if (P === owner && P.run === run) fn(); }, ms);
  P.timers.push(id);
}
/* Dừng mọi thứ đang chạy: giọng mẫu, nhận diện, micro và hẹn giờ */
function interrupt() {
  if (!P) return;
  P.run++;
  P.timers.forEach(clearTimeout);
  P.timers = [];
  Recog.stop();
  if (P.mic !== "recording") Mic.stop(true);
  P.meterOn = false;
  Speech.cancel();
}
/* Xin quyền micro bằng thao tác chủ động của người dùng, sau đó nhả micro ngay */
async function ensureMic() {
  if (micReady) return true;
  try {
    if (navigator.permissions && navigator.permissions.query) {
      const st = await navigator.permissions.query({ name: "microphone" });
      if (st.state === "granted") { micReady = true; return true; }
    }
  } catch (e) { /* trình duyệt không hỗ trợ truy vấn quyền: đi tiếp bên dưới */ }
  if (!Mic.canUseMic()) {
    // Safari cũ có nhận diện nhưng không có getUserMedia: để bộ nhận diện tự xin quyền
    if (window.isSecureContext === false) throw "insecure";
    micReady = true;
    return true;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((tr) => tr.stop());
    micReady = true;
    return true;
  } catch (e) {
    const map = { NotAllowedError: "denied", PermissionDeniedError: "denied", SecurityError: "denied", NotFoundError: "nomic", DevicesNotFoundError: "nomic", NotReadableError: "busy", TrackStartError: "busy" };
    throw map[e && e.name] || "unknown";
  }
}
function showError(code) {
  if (!P) return;
  interrupt();
  P.feedback = null;
  P.errCode = code;
  setPhase("error");
}
/* Thao tác duy nhất người học cần làm: nhấn Nghe mẫu hoặc Tiếp tục */
async function startLesson() {
  if (!P) return;
  if (P.solved) { advance(); return; }
  autoRun = true;
  interrupt();
  const owner = P, run = P.run;
  if (!micReady) setPhase("perm");
  try { await ensureMic(); }
  catch (code) { if (P === owner && P.run === run) showError(code); return; }
  if (P === owner && P.run === run) playModel();
}
function playModel() {
  if (!P) return;
  interrupt();
  P.note = null;
  setPhase("model");
  const owner = P, run = P.run;
  Speech.speak(P.s.en, SPEEDS[state.speed].rate).then((r) => {
    if (P !== owner || P.run !== run) return;
    if (r === "canceled") return;
    if (r === "error") P.note = SPEECH_FAILED;
    if (r === "unsupported") P.note = SPEECH_UNSUPPORTED;
    // Chờ một nhịp để micro không thu phải đuôi giọng mẫu
    later(goListen, 250);
  });
}
function goListen() {
  if (!P) return;
  interrupt();
  markActive();
  P.interim = "";
  P.nudge = false;
  P.history = new Array(36).fill(0);
  P.meterOn = meterAllowed && Mic.canUseMic() && Mic.canMeasure();
  setPhase("turn");
  later(() => { P.nudge = true; syncLesson(); }, SILENCE_NUDGE_MS);
  if (P.meterOn) startWave();
  const owner = P, run = P.run;
  const stale = () => P !== owner || P.run !== run;
  Recog.start({
    onSpeech() {
      if (stale()) return;
      markActive();
      P.nudge = false;
      if (P.phase === "turn") setPhase("listening");
      else syncLesson();
    },
    onInterim(text) {
      if (stale()) return;
      P.interim = text;
      P.nudge = false;
      if (P.feedback) { P.feedback = null; syncLive(); }
      if (P.phase !== "listening") setPhase("listening");
      const el = $("#interim");
      if (el) el.textContent = text;
    },
    onFinal(alts) { if (!stale()) judge(alts); },
    onError(code) {
      if (stale()) return;
      if (code === "no-speech") { P.endReason = "silent"; return; }
      if (code === "audio-capture" && P.meterOn) {
        // Micro không phục vụ được cả hai nơi: bỏ đo âm lượng, giữ nhận diện
        meterAllowed = false;
        later(goListen, 300);
        P.endReason = "retry";
        return;
      }
      const map = { "not-allowed": "denied", "service-not-allowed": "service", "audio-capture": "nomic", network: "network", "language-not-supported": "service", "start-failed": "unknown" };
      if (code === "not-allowed") micReady = false;
      showError(map[code] || "unknown");
    },
    onEnd() {
      if (stale()) return;
      const reason = P.endReason;
      P.endReason = null;
      if (reason === "retry") return;
      if (P.interim) {
        // Chỉ có kết quả tạm mà không có kết quả cuối: không chấm, nhờ nói lại
        P.note = "Mình chưa nghe rõ, hãy thử lại";
        later(goListen, 900);
        syncLive();
        return;
      }
      P.silentRounds++;
      if (P.silentRounds >= MAX_SILENT_ROUNDS) {
        // Im lặng lâu: nhả micro thay vì nghe mãi, và không tính là sai
        interrupt();
        setPhase("held");
        return;
      }
      goListen();
    }
  });
}
function startWave() {
  const owner = P;
  Mic.start({
    meterOnly: true,
    onLive() {},
    onLevel(level) { if (P === owner) drawWave(level); },
    onDone() {},
    onError() {}
  });
}
function drawWave(level) {
  const c = $("#wave");
  if (!c || !c.width) return;
  const g = c.getContext("2d");
  const w = c.width, h = c.height, bars = 36, hist = P.history;
  hist.push(level);
  if (hist.length > bars) hist.shift();
  g.clearRect(0, 0, w, h);
  g.fillStyle = "#C2412D";
  const bw = w / bars;
  hist.forEach((lv, i) => {
    const bh = Math.max(3, lv * h);
    g.fillRect((bars - hist.length + i) * bw + bw * .18, (h - bh) / 2, bw * .64, bh);
  });
}
/* Chấm kết quả cuối, chọn phương án nhận diện có lợi nhất cho người học */
function judge(alts) {
  if (P.solved) return;
  const rank = { wrong: 0, near: 1, correct: 2 };
  let best = null;
  alts.forEach((text) => {
    const g = gradeSpeech(text, P.s);
    if (!best || rank[g.level] > rank[best.level] || (rank[g.level] === rank[best.level] && g.score > best.score)) best = { ...g, heard: text.trim() };
  });
  interrupt();
  if (!best || !best.heard) { P.note = "Mình chưa nghe rõ, hãy thử lại"; later(goListen, 900); syncLive(); return; }
  markActive();
  P.silentRounds = 0;
  P.note = null;
  P.interim = "";
  const rec = P.rec;
  rec.attempts++;
  P.sessionAttempts++;
  rec.lastHeard = best.heard;
  if (!rec.firstResult) rec.firstResult = best.level;
  todayRecord().reps++;
  state.totalReps++;
  practiceSessionReps++;
  recordActivity();
  if (best.level === "correct") {
    P.solved = true;
    rec.successes++;
    if (!rec.completedAt) rec.completedAt = Date.now();
    rec.status = "done";
    rec.review = P.sessionAttempts > 1;
    save();
    P.feedback = null;
    confetti();
    vibrate(20);
    setPhase("correct");
    later(() => { setPhase("moving"); later(advance, 350); }, 1000);
    return;
  }
  rec.review = true;
  save();
  P.feedback = best;
  setPhase(best.level);
  later(goListen, best.level === "near" ? 1600 : 2400);
}
/* Câu tiếp theo tùy lượt học; không còn câu thì sang màn hình chúc mừng */
function nextIndex() {
  const t = P.t, n = t.sentences.length;
  if (P.mode === "review") return reviewList(t).find((i) => !lessonSeen.has(i));
  if (P.mode === "all") return P.index + 1 < n ? P.index + 1 : undefined;
  for (let k = 1; k <= n; k++) {
    const i = (P.index + k) % n;
    if (isOpen(t.id, i)) return i;
  }
  return undefined;
}
function advance() {
  if (!P) return;
  const i = nextIndex();
  if (i === undefined) { autoRun = false; location.hash = `#/finish/${P.t.id}`; return; }
  gotoSentence(i);
}

  if (P.mic === "recording" && P.live.measuring) {

    if (c) { const dpr = window.devicePixelRatio || 1; c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; }
  }
  if (P.mic === "recording" || P.mic === "error" || P.mic === "recorded") box.scrollIntoView({ block: "nearest" });
}
function drawMeter(level) {
  const c = $("#meter");
  if (!c || !c.width) return;
  const g = c.getContext("2d");
  const w = c.width, h = c.height;
  const hist = P.history;
  const bars = 36;
  hist.push(level);
  if (hist.length > bars) hist.shift();
  g.clearRect(0, 0, w, h);
  const bw = w / bars;
  hist.forEach((lv, i) => {
    const bh = Math.max(3, lv * h);
    g.fillStyle = lv >= LOUD_TARGET ? "#0B6B63" : "#C2412D";
    g.globalAlpha = lv >= LOUD_TARGET ? 1 : .7;
    const x = (bars - hist.length + i) * bw;
    g.fillRect(x + bw * .18, h - bh, bw * .64, bh);
  });
  g.globalAlpha = 1;
  const y = h - LOUD_TARGET * h;
  g.strokeStyle = "#1F2A37";
  g.lineWidth = Math.max(1, (window.devicePixelRatio || 1) * 1.2);
  g.setLineDash([6, 5]);
  g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
  g.setLineDash([]);
}
function onLevel(level) {
  if (!P || P.mic !== "recording") return;
  drawMeter(level);
  const now = performance.now();
  if (level >= LOUD_TARGET) { P.goodUntil = now + 700; P.loudSeen = true; }
  const next = now < P.goodUntil ? "good" : level >= QUIET_LEVEL ? "low" : "quiet";
  if (next !== P.meter) {
    P.meter = next;
    const el = $("#meterStatus");
    if (el) {
      el.dataset.s = next;
      el.innerHTML = next === "good" ? `${ic("check")}Tốt lắm! Đủ to rồi.`
        : next === "low" ? `${ic("sound")}Nói to hơn!`
        : `${ic("mic")}Mình đang nghe, hãy nói đi!`;
    }
  }
}
function startMic() {
  if (!P || P.mic === "requesting" || P.mic === "recording") return;
  Speech.cancel();
  stopPlayback();
  clearRecording();
  P.mic = "requesting";
  P.loudSeen = false; P.history = []; P.meter = "quiet"; P.seconds = 0;
  syncSpeak();
  const owner = P;
  Mic.start({
    onLive(live) {
      if (P !== owner) return;
      if (!live.measuring && !live.recording) {
        Mic.stop(true);
        P.mic = "error"; P.micErr = "unsupported";
        syncSpeak();
        return;
      }
      P.live = live;
      P.mic = "recording";
      P.seconds = 0;
      P.timer = setInterval(() => {
        if (P !== owner) return;
        P.seconds++;
        markActive();
        const el = $("#recTime");
        if (el) el.textContent = mmss(P.seconds);
        if (P.seconds >= MAX_RECORD_SECONDS) { toast("Đã tự dừng sau 1 phút."); stopMic(); }
      }, 1000);
      syncSpeak();
    },
    onLevel,
    onDone({ url }) {
      if (P !== owner) { if (url) URL.revokeObjectURL(url); return; }
      P.recUrl = url;
      P.mic = url ? "recorded" : "measured";
      syncSpeak();
    },
    onError(code) {
      if (P !== owner) return;
      P.mic = "error";
      P.micErr = code;
      syncSpeak();
    }
  });
}
function stopMic() {
  if (!P || P.mic !== "recording") return;
  clearInterval(P.timer);
  Mic.stop(false);
}
function stopPlayback() {
  if (P && P.audio) {
    P.audio.pause();
    P.audio = null;
    if (P.playing) { P.playing = false; if (P.mic === "recorded") syncSpeak(); }
  }
}
function clearRecording() {
  if (P && P.recUrl) { URL.revokeObjectURL(P.recUrl); P.recUrl = null; }
}
function togglePlayback() {
  if (!P || !P.recUrl) return;
  if (P.playing) { stopPlayback(); return; }
  Speech.cancel();
  const owner = P;
  const audio = new Audio(P.recUrl);
  const finish = () => {
    if (P !== owner || P.audio !== audio) return;
    P.audio = null; P.playing = false; syncSpeak();
  };
  audio.onended = finish;
  audio.onerror = () => { finish(); toast("Không phát lại được bản ghi. Hãy thử ghi lại."); };
  P.audio = audio; P.playing = true;
  syncSpeak();
  const p = audio.play();
  if (p && p.catch) p.catch(() => { finish(); });
}
/* Giải phóng toàn bộ tài nguyên khi rời màn hình hoặc đổi câu */
function cleanupPractice() {
  if (!P) return;
  P.run++;
  P.timers.forEach(clearTimeout);
  clearInterval(P.timer);
  Recog.stop();
  Mic.stop(true);
  Speech.cancel();
  stopPlayback();
  clearRecording();
  P = null;
}

/* Hàng đợi: từ chưa nhớ lên đầu (sai nhiều xếp trước), rồi đến từ mới */
function buildQueue(items) {

  if (known) {

function shuffle(arr) {

  for (let i = a.length - 1; i > 0; i--) {

    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

}
function challengeRep() {
  const ch = state.challenge;
  const t = topicById(ch.topicId);
  addRep(t, ch.current);
  ch.reps++;
  if (!ch.seen.includes(ch.current)) ch.seen.push(ch.current);
  markActive();
  vibrate(15);
}
function finishChallenge() {
  clearInterval(C.timer);
  Speech.cancel();
  const ch = state.challenge;
  if (!ch) return;
  const t = topicById(ch.topicId);
  const seconds = Math.round((Math.min(Date.now(), ch.endAt) - ch.startAt) / 1000);
  C.result = { topicId: ch.topicId, seconds, sentences: ch.seen.length, reps: ch.reps, record: ch.reps > state.challengeBest && ch.reps > 0, badge: t && awardBadgeIfNew(t) };
  C.pick = ch.topicId;
  state.challengeRuns++;
  state.challengeBest = Math.max(state.challengeBest, ch.reps);
  state.challenge = null;
  save();
  if (C.result.reps > 0) confetti();
  drawChallengeResult();
}
function resultMessage(r) {
  if (r.reps === 0) return "Không sao cả! Lần sau hãy thử nói thành tiếng một câu nhé.";
  if (r.record && state.challengeRuns > 1) return "Kỷ lục mới! Bạn đang tiến bộ từng ngày.";
  if (r.reps >= 40) return "Quá xuất sắc! Phản xạ của bạn đang rất nhanh.";
  if (r.reps >= 15) return "Tuyệt vời! Bạn đã nói rất nhiều trong 5 phút.";
  return "Bạn làm tốt lắm! Mỗi lần mở miệng là một bước tiến.";
}
function drawChallengeResult() {
  const r = C.result;
  const t = topicById(r.topicId);
  view.innerHTML = `<div class="screen stack fc-wrap" style="padding-top:8px">
    <div class="empty" style="padding:18px 8px 4px">
      <div class="big">${r.reps ? "🏆" : "💪"}</div>
      <h1 class="title">Kết quả thử thách</h1>
      <p class="muted">${t ? `${t.icon} ${esc(t.vi)}` : ""}</p>
    </div>
    <div class="result-num">
      <div class="tile"><b>${r.sentences}</b><span>câu đã luyện</span></div>
      <div class="tile"><b>${mmss(r.seconds)}</b><span>tổng thời gian</span></div>
      <div class="tile"><b>${r.reps}</b><span>lần lặp</span></div>
    </div>
    <div class="notice notice-good">${ic("check")}<div>${esc(resultMessage(r))}${r.badge ? " Bạn còn nhận được huy hiệu mới của chủ đề này!" : ""}</div></div>
    <button class="btn btn-primary btn-lg btn-block" data-act="restartChallenge">${ic("redo")}Bắt đầu lại</button>
    <button class="btn btn-ghost btn-block" data-act="changeChallenge">Đổi chủ đề</button>
    <a class="btn btn-ghost btn-block" href="#/home">Về trang chủ</a>
  </div>`;
}
function cleanupChallenge() {
  clearInterval(C.timer);
  Speech.cancel();
}

/* --- 5.6 Tiến độ --- */
const BADGE_RULES = [
  { e: "🌱", name: "Câu đầu tiên", got: () => doneTotal() >= 1, how: "Xong 1 câu" },
  { e: "🔥", name: "3 ngày liên tiếp", got: () => state.bestStreak >= 3, how: "Học 3 ngày liền" },
  { e: "⭐", name: "7 ngày liên tiếp", got: () => state.bestStreak >= 7, how: "Học 7 ngày liền" },
  { e: "🗣️", name: "100 lần nói", got: () => state.totalReps >= 100, how: "Nói 100 lần" },
  { e: "⚡", name: "Vượt thử thách", got: () => state.challengeBest > 0, how: "Làm 1 thử thách" }
];
function chart7Days() {
  const days = [];
  const names = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  for (let n = 6; n >= 0; n--) {
    const d = daysAgo(n);
    const data = dayData(dateKey(d));
    days.push({ name: n === 0 ? "Nay" : names[d.getDay()], full: `${d.getDate()}/${d.getMonth() + 1}`, min: data.seconds / 60, reps: data.reps, today: n === 0 });
  }
  const top = Math.max(state.goalMin, ...days.map((d) => d.min));
  const pct = (v) => v / top * 100;
  // Vùng vẽ cao 126px (150px trừ 24px nhãn); vạch mục tiêu tính theo cùng tỉ lệ với cột
  return `<div class="chart" aria-hidden="true">
      <div class="goal-line" style="bottom:calc(24px + (100% - 24px) * ${pct(state.goalMin) / 100})"><span>Mục tiêu ${state.goalMin} phút</span></div>
      ${days.map((d) => {
        const m = Math.round(d.min);
        return `<div class="col ${d.today ? "today" : ""}" tabindex="0">
          <span class="tip">${d.full}: ${m} phút · ${d.reps} lần nói</span>
          ${d.today && d.min > 0 ? `<span class="val">${m}</span>` : ""}
          <div class="fill ${d.min > 0 ? "" : "zero"}" style="height:${Math.max(pct(d.min), d.min > 0 ? 2 : 0)}%"></div>
          <span class="lb">${d.name}</span>
        </div>`;
      }).join("")}
    </div>
    <table class="sr"><caption>Thời gian học 7 ngày gần nhất</caption>
      <tr><th>Ngày</th><th>Số phút</th><th>Số lần nói</th></tr>
      ${days.map((d) => `<tr><td>${d.full}</td><td>${Math.round(d.min)}</td><td>${d.reps}</td></tr>`).join("")}
    </table>`;
}
function renderProgress() {
  const hasData = state.totalReps > 0 || Object.keys(state.words).length > 0 || Object.values(state.days).some((d) => d.seconds > 0);
  const today = dayData();
  const totalSec = Object.values(state.days).reduce((n, d) => n + (d.seconds || 0), 0);
  const scaleBtn = (k, label) => `<button data-act="setScale" data-scale="${k}" aria-pressed="${state.scale === k}">${label}</button>`;
  const goalBtn = (m) => `<button data-act="setGoal" data-min="${m}" aria-pressed="${state.goalMin === m}">${m} phút</button>`;
  const dev = (ok, text, fix) => `<div class="device"><span class="${ok ? "ok" : "no"}">${ic(ok ? "check" : "x")}</span><div>${text}${ok ? "" : `<br><span class="small muted">${fix}</span>`}</div></div>`;
  const secure = window.isSecureContext !== false;
  view.innerHTML = `<div class="screen">
    <header class="page-head">
      <h1 class="title">Tiến độ của bạn</h1>
      <p class="muted">${state.lastStudyDate ? `Ngày học gần nhất: ${state.lastStudyDate.split("-").reverse().join("/")}` : "Bạn chưa bắt đầu buổi học nào."}</p>
    </header>
    <div class="progress-grid">
      ${storageNotice() ? `<div class="wide">${storageNotice()}</div>` : ""}
      ${hasData ? `
      <section class="wide">
        <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr))">
          <div class="tile"><b>🔥 ${currentStreak()}</b><span>ngày liên tiếp</span></div>
          <div class="tile"><b>${state.totalReps}</b><span>lần nói</span></div>
          <div class="tile"><b>${doneTotal()}/${totalSentences()}</b><span>câu hoàn thành</span></div>
          <div class="tile"><b>${knownTotal()}/${totalWords()}</b><span>từ đã nhớ</span></div>
          <div class="tile"><b>${minutesOf(today.seconds)}</b><span>phút hôm nay</span></div>
          <div class="tile"><b>${minutesOf(totalSec)}</b><span>tổng số phút</span></div>
        </div>
      </section>
      <section class="card">
        <p class="subtitle" style="margin-bottom:20px">Thời gian học 7 ngày qua (phút)</p>
        ${chart7Days()}
      </section>` : `
      <section class="card empty wide">
        <div class="big">🌱</div>
        <p class="subtitle">Chưa có dữ liệu học tập</p>
        <p class="muted" style="margin-bottom:16px">Nói câu tiếng Anh đầu tiên, tiến độ sẽ hiện ở đây.</p>
        <a class="btn btn-primary" href="#/topics">Chọn chủ đề để bắt đầu</a>
      </section>`}
      <section class="card stack">
        <p class="subtitle">Theo từng chủ đề</p>
        ${TOPICS.map((t) => `
          <a href="${topicHref(t)}" style="display:block">
            <div class="row between" style="margin-bottom:5px"><b class="small">${t.icon} ${esc(t.vi)}</b><span class="small muted" style="white-space:nowrap">${doneInTopic(t)}/${t.sentences.length} câu · ${knownInTopic(t)}/${t.words.length} từ</span></div>
            ${bar(topicPercent(t), topicStatus(t) === "done" ? "good" : "")}
          </a>`).join("")}
      </section>
      <section class="card stack wide">
        <p class="subtitle">Huy hiệu</p>
        <div class="badges">
          ${TOPICS.map((t) => {
            const got = !!state.badges[t.id];
            return `<div class="badge ${got ? "" : "off"}"><div class="e">${t.icon}</div><p>${esc(t.vi)}</p><small>${got ? "Đã đạt" : "Chưa đạt"}</small></div>`;
          }).join("")}
          ${BADGE_RULES.map((b) => {
            const got = b.got();
            return `<div class="badge ${got ? "" : "off"}"><div class="e">${b.e}</div><p>${b.name}</p><small>${got ? "Đã đạt" : b.how}</small></div>`;
          }).join("")}
        </div>
      </section>
      <section class="card stack">
        <p class="subtitle">Cài đặt</p>
        <div><p class="small muted" style="margin-bottom:4px">Mục tiêu mỗi ngày</p><div class="seg">${goalBtn(10)}${goalBtn(15)}${goalBtn(20)}</div></div>
        <div><p class="small muted" style="margin-bottom:4px">Cỡ chữ</p><div class="seg">${scaleBtn("md", "Vừa")}${scaleBtn("lg", "Lớn")}${scaleBtn("xl", "Rất lớn")}</div></div>
        <div id="resetBox"><button class="btn btn-ghost btn-block" data-act="askReset">Xóa toàn bộ tiến độ</button></div>
      </section>
      <section class="card stack">
        <p class="subtitle">Thiết bị của bạn</p>
        ${dev(Speech.supported, "Nghe giọng đọc mẫu", "Hãy dùng Chrome, Edge hoặc Safari bản mới.")}
        ${dev(secure && Mic.canUseMic(), "Dùng micro", secure ? "Trình duyệt này chưa hỗ trợ micro." : "Micro chỉ chạy trên địa chỉ https hoặc localhost.")}
        ${dev(Mic.canMeasure(), "Đo độ to giọng nói", "Trình duyệt này chưa hỗ trợ đo âm lượng.")}
        ${dev(Mic.canRecord(), "Ghi âm và nghe lại", "Trình duyệt này chưa hỗ trợ ghi âm.")}
      </section>
    </div>
  </div>`;
}

/* ============================================================
   PHẦN 6: XỬ LÝ THAO TÁC (mọi nút bấm dùng thuộc tính data-act)
   ============================================================ */
const Actions = {
  say(el) { sayFromButton(el, el.dataset.text, SPEEDS.normal.rate); },
  closeSheet() { closeSheet(); },

  /* Luyện câu */
  startLesson, playModel, goListen,
  retryLesson() { micReady = false; startLesson(); },
  pauseLesson, skipSentence,
  setSpeed(el) {
    state.speed = el.dataset.speed;
    save();
    syncSpeed();
    if (P && P.phase === "model") playModel();
  },
  toggleVi() { state.showVi = !state.showVi; save(); syncVi(); },
  useManual() { if (P) { Recog.stop(); P.forceManual = manualPreferred = true; renderManualMode(); } },
  manualDone,
  startMic, stopMic,
  playback: togglePlayback,
  pickSentence() { if (P) { pauseIfActive(); openPicker(); } },
  jumpSentence(el) { closeSheet(); gotoSentence(parseInt(el.dataset.i, 10)); },
  guide() { pauseIfActive(); openGuide(); },

  /* Từ vựng */
  flip: flipCard,
  rateKnown() { rateWord(true); },
  rateAgain() { rateWord(false); },
  vocabRestart() {
    if (!V) return;
    // Ôn lại toàn bộ từ của chủ đề, từ đang "chưa nhớ" vẫn được ưu tiên lên đầu
    const fresh = buildQueue(V.items);
    const rest = V.items.filter((x) => !fresh.includes(x));
    V.queue = [...fresh, ...rest];
    drawVocab();
  },

  /* Thử thách */
  pickChallenge(el) { C.pick = el.dataset.id; drawChallengeSetup(); },
  startChallenge() { startChallenge(C.pick); },
  chReplay() { speakChallenge(); },
  chRepeat() { if (!state.challenge) return; challengeRep(); save(); drawChallengeRun(); speakChallenge(); },
  chNext() { if (!state.challenge) return; challengeRep(); nextChallengeSentence(); save(); drawChallengeRun(); speakChallenge(); },
  endChallenge() { finishChallenge(); },
  restartChallenge() { startChallenge(C.result.topicId); },
  changeChallenge() { C.result = null; drawChallengeSetup(); },

  /* Tiến độ */
  setGoal(el) { state.goalMin = parseInt(el.dataset.min, 10); save(); renderProgress(); },
  setScale(el) { state.scale = el.dataset.scale; applyScale(); save(); renderProgress(); },
  askReset() {
    $("#resetBox").innerHTML = `<div class="notice notice-bad">${ic("warn")}<div><b>Xóa toàn bộ tiến độ?</b>Việc này không thể hoàn tác.</div></div>
      <div class="two" style="margin-top:10px">
        <button class="btn btn-ghost" data-act="cancelReset">Giữ lại</button>
        <button class="btn btn-danger" data-act="confirmReset">Xóa</button>
      </div>`;
  },
  cancelReset() { renderProgress(); },
  confirmReset() {
    const keep = { scale: state.scale };
    state = Object.assign(defaultState(), keep);
    save();
    toast("Đã xóa tiến độ. Bắt đầu lại nào!");
    renderProgress();
  }
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  // Nút bên trong thẻ từ vựng không làm lật thẻ, vì closest() đã chọn đúng nút trong cùng
  const fn = Actions[el.dataset.act];
  if (fn) fn(el);
});

function applyScale() { document.documentElement.dataset.scale = state.scale; }

/* ============================================================
   PHẦN 7: ĐIỀU HƯỚNG THEO ĐỊA CHỈ (#/...)
   Trang được tải lại vẫn mở đúng màn hình, nút Back của điện thoại vẫn hoạt động.
   ============================================================ */
const NAV_ITEMS = [
  { key: "home", href: "#/home", label: "Trang chủ", icon: "home" },
  { key: "topics", href: "#/topics", label: "Chủ đề", icon: "book" },
  { key: "vocab", href: "#/vocab", label: "Từ vựng", icon: "cards" },
  { key: "progress", href: "#/progress", label: "Tiến độ", icon: "chart" }
];
function renderNav(active) {
  $("#navLinks").innerHTML = NAV_ITEMS.map((n) =>
    `<a class="link" href="${n.href}" ${n.key === active ? 'aria-current="page"' : ""}>${ic(n.icon)}${n.label}</a>`).join("");
}
let currentRoute = { name: "", learning: false };
function route() {
  const [name = "home", a, b, c] = location.hash.replace(/^#\/?/, "").split("/").map((x) => decodeURIComponent(x));
  const leavingPractice = currentRoute.name === "practice" && name !== "practice";
  closeSheet();
  cleanupPractice();
  cleanupChallenge();
  V = null;
  if (currentRoute.name === "challenge" && name !== "challenge") C.result = null;
  if (leavingPractice && practiceSessionReps >= 3) {
    toast(`Buổi luyện tốt lắm! Bạn vừa nói thêm ${practiceSessionReps} lần.`);
  }
  if (leavingPractice) { practiceSessionReps = 0; autoRun = false; lessonSeen = new Set(); }

  const vocabSession = name === "vocab" && a;
  const focus = name === "practice" || vocabSession || name === "challenge";
  if (focus) document.body.dataset.focus = "1"; else delete document.body.dataset.focus;
  const sameScreen = currentRoute.name === name && name === "practice";
  currentRoute = { name, learning: name === "practice" || vocabSession || name === "challenge" };
  renderNav(name === "vocab" ? "vocab" : name);

  switch (name) {
    case "": case "home": renderNav("home"); renderHome(); break;
    case "topics": renderTopics(); break;
    case "practice": renderPractice(a, b, c); break;
    case "finish": renderFinish(a); break;
    case "vocab": a ? renderVocabSession(a) : renderVocabHome(); break;
    case "progress": renderProgress(); break;
    case "challenge": renderChallenge(); break;
    default: view.innerHTML = notFound();
  }
  if (!sameScreen) { window.scrollTo(0, 0); view.focus({ preventScroll: true }); }
}
window.addEventListener("hashchange", route);

/* ============================================================
   PHẦN 8: ĐẾM THỜI GIAN HỌC VÀ LƯU KHI RỜI TRANG
   Chỉ đếm khi đang ở màn hình học, trang đang hiển thị và có thao tác gần đây.
   ============================================================ */
let lastActive = Date.now();
const markActive = () => { lastActive = Date.now(); };
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, markActive, { passive: true }));
let unsavedSeconds = 0;
setInterval(() => {
  if (!currentRoute.learning || document.hidden || Date.now() - lastActive > 90000) return;
  const day = todayRecord();
  const goalSec = state.goalMin * 60;
  const before = day.seconds;
  day.seconds++;
  if (P && P.rec) P.rec.seconds = (P.rec.seconds || 0) + 1;
  if (before < goalSec && day.seconds >= goalSec) {
    toast(`🎯 Bạn đã đạt mục tiêu ${state.goalMin} phút hôm nay. Giỏi lắm!`);
    save();
  }
  if (++unsavedSeconds >= 10) { unsavedSeconds = 0; save(); }
}, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  save();
  // Trả micro và dừng âm thanh khi người dùng chuyển sang ứng dụng khác
  if (P) {
    if (P.mic === "recording") stopMic();
    Speech.cancel();
    stopPlayback();
    pauseIfActive();
  }
});
window.addEventListener("pagehide", () => { save(); Recog.stop(); Mic.stop(true); Speech.cancel(); });

/* ============================================================
   PHẦN 9: KHỞI ĐỘNG ỨNG DỤNG
   ============================================================ */
applyScale();
Speech.init();
route();
</script>
</body>
</html>
