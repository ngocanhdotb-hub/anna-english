<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Anna English – Luyện nói tiếng Anh mỗi ngày</title>

<!-- Font Be Vietnam Pro; nếu không tải được sẽ tự dùng font hệ thống trong --font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PHẦN GIAO DIỆN (CSS) – thiết kế theo Mobile-first
   ============================================================ */
:root {
  --font: "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --bg: #FFF8F1;
  --surface: #FFFFFF;
  --ink: #1F2A37;
  --muted: #566070;
  --line: #EFE3D6;
  --primary: #C2412D;
  --primary-dark: #A33422;
  --primary-soft: #FDEBE4;
  --good: #0B6B63;
  --good-soft: #DCF3EE;
  --warn: #8A5300;
  --warn-soft: #FFF1D6;
  --danger: #B42318;
  --danger-soft: #FDE7E4;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 1px 2px rgba(80, 50, 30, .05), 0 6px 20px rgba(80, 50, 30, .06);
  --nav-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
html[data-scale="lg"] { font-size: 112.5%; }
html[data-scale="xl"] { font-size: 125%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.5 var(--font); overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; border-radius: 6px; }
svg.ic { width: 1.4em; height: 1.4em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Khung ứng dụng */
#view { padding: 16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; outline: none; }
.screen { animation: fadeIn .2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }

/* Thanh điều hướng: dưới cùng trên điện thoại, cột trái trên desktop */
#nav {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
#nav .brand { display: none; }
#nav .links { display: grid; grid-template-columns: repeat(4, 1fr); }
#nav a.link {
  min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: .8125rem; font-weight: 500; color: var(--muted); position: relative;
}
#nav a.link[aria-current="page"] { color: var(--primary); font-weight: 700; }
#nav a.link[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; background: var(--primary); border-radius: 0 0 4px 4px;
}
body[data-focus] #nav { display: none; }
body[data-focus] #view { padding-bottom: 0; }

/* Thành phần chung */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.title { font-size: 1.5rem; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; }
.subtitle { font-size: 1.0625rem; font-weight: 700; }
.page-head { padding: 6px 2px 14px; }

.btn {
  min-height: 48px; padding: 10px 18px; border-radius: 14px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .6; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(194, 65, 45, .28); }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-soft { background: var(--primary-soft); color: var(--primary-dark); }
.btn-ghost { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px #D9C8B6; }
.btn-good { background: var(--good); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-lg { min-height: 56px; font-size: 1.0625rem; }
.btn-block { width: 100%; }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn:hover { background: rgba(0, 0, 0, .04); }

.bar { height: 10px; background: #F3E7DA; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s ease; }
.bar.good > i { background: var(--good); }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: .8125rem; font-weight: 600; white-space: nowrap; }
.tag svg.ic { width: 1.1em; height: 1.1em; }
.tag-new { background: #F2EBE3; color: var(--muted); }
.tag-doing { background: var(--warn-soft); color: var(--warn); }
.tag-done { background: var(--good-soft); color: var(--good); }

.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: .9375rem; }
.notice b { display: block; }
.notice-warn { background: var(--warn-soft); color: #5F3A00; }
.notice-bad { background: var(--danger-soft); color: #7A1A12; }
.notice-good { background: var(--good-soft); color: #084C46; }

.empty { text-align: center; padding: 36px 20px; }
.empty .big { font-size: 2.75rem; line-height: 1; margin-bottom: 10px; }

/* Thông báo nhanh, đặt phía trên để không che vùng ngón cái */
#toasts { position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: grid; justify-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: .9375rem; max-width: 460px; box-shadow: 0 8px 24px rgba(0, 0, 0, .22); animation: toastIn .22s ease-out; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } }

/* Bảng trượt từ dưới lên */
dialog#sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 86vh; border-radius: 24px 24px 0 0; background: var(--surface); color: var(--ink); }
dialog#sheet::backdrop { background: rgba(31, 42, 55, .45); }
dialog#sheet[open] { animation: sheetUp .22s ease-out; }
@keyframes sheetUp { from { transform: translateY(30px); opacity: .4; } }
.sheet-body { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.sheet-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; min-height: 56px; border-radius: 14px; }
.sheet-item:hover { background: var(--bg); }
.sheet-item[aria-current="true"] { background: var(--primary-soft); }
.sheet-item .no { width: 30px; height: 30px; border-radius: 50%; background: #F3E7DA; display: grid; place-items: center; font-size: .875rem; font-weight: 700; flex: none; }
.sheet-item .no.ok { background: var(--good); color: #fff; }
.sheet-item .txt { flex: 1; min-width: 0; font-weight: 600; }
.guide-step { display: flex; gap: 12px; align-items: flex-start; }
.guide-step .no { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); display: grid; place-items: center; font-weight: 800; flex: none; }

/* --- Trang chủ --- */
.home-grid { display: grid; gap: 14px; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 2px; }
.hero h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.25; }
.streak { display: flex; flex-direction: column; align-items: center; padding: 6px 12px; background: var(--warn-soft); color: #5F3A00; border-radius: 16px; flex: none; }
.streak b { font-size: 1.25rem; line-height: 1.2; }
.streak span { font-size: .75rem; font-weight: 600; white-space: nowrap; }
.resume { background: var(--ink); color: #fff; }
.resume .eyebrow { font-size: .875rem; font-weight: 600; opacity: .85; }
.resume .topic-line { font-size: 1.125rem; font-weight: 700; margin-top: 2px; }
.resume .sent { margin: 6px 0 14px; opacity: .9; }
.goal { display: flex; align-items: center; gap: 16px; }
.ring { width: 76px; height: 76px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .tr { stroke: #F3E7DA; }
.ring .fg { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
.ring.ok .fg { stroke: var(--good); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1rem; font-weight: 800; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 12px 8px; text-align: center; min-width: 0; }
.tile b { display: block; font-size: 1.5rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile span { display: block; font-size: .8125rem; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.quote { background: var(--primary-soft); box-shadow: none; }
.quote .en { font-size: 1.125rem; font-weight: 700; }
.challenge-link { display: flex; align-items: center; gap: 12px; }
.challenge-link .ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn); flex: none; }
.challenge-link .grow { flex: 1; min-width: 0; }

/* --- Thẻ chủ đề --- */
.topic-grid { display: grid; gap: 12px; }
.topic-card { display: block; transition: transform .12s ease, box-shadow .12s ease; width: 100%; text-align: left; }
.topic-card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(80, 50, 30, .06), 0 10px 26px rgba(80, 50, 30, .1); }
.topic-ico { width: 52px; height: 52px; background: var(--primary-soft); border-radius: 16px; display: grid; place-items: center; font-size: 1.625rem; flex: none; }
.topic-card h3 { font-size: 1.0625rem; font-weight: 700; line-height: 1.3; }

/* --- Màn hình luyện câu --- */
.pr-head { display: flex; align-items: center; gap: 4px; margin: -8px -8px 2px; }
.pr-head .mid { flex: 1; min-width: 0; text-align: center; }
.pr-head .tn { font-size: .875rem; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-jump { display: inline-flex; align-items: center; gap: 2px; min-height: 28px; font-weight: 700; }
.pr-jump svg.ic { width: 1.05em; height: 1.05em; }
.pr-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-bottom: 150px; }
#speakPanel { scroll-margin-bottom: 150px; }
.sentence { text-align: center; padding: 6px 4px 0; }
.sentence .en { font-size: 2.25rem; font-weight: 800; line-height: 1.2; letter-spacing: -.015em; overflow-wrap: anywhere; }
.sentence .en.long { font-size: 1.75rem; }
.sentence .vi { margin-top: 6px; font-size: 1.0625rem; color: var(--muted); min-height: 1.6em; }
.toggle-vi { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 2px 10px; font-size: .875rem; font-weight: 600; color: var(--muted); }
.hint { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--primary-soft); color: #6E2415; font-weight: 600; font-size: .9375rem; }
.hint.done { background: var(--good-soft); color: #084C46; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #F5ECE2; border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-width: 0; min-height: 42px; border-radius: 10px; font-size: .875rem; font-weight: 600; color: var(--muted); padding: 2px 4px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.rec-line { display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: var(--danger); }
.rec-dot { width: 11px; height: 11px; background: var(--danger); border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
canvas.meter { width: 100%; height: 64px; display: block; background: #FBF4EC; border-radius: 12px; }
.meter-status { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; min-height: 26px; text-align: center; }
.meter-status[data-s="low"] { color: var(--primary-dark); }
.meter-status[data-s="good"] { color: var(--good); }
.meter-status[data-s="quiet"] { color: var(--muted); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-mic { min-height: 60px; font-size: 1.125rem; }
.btn-mic svg.ic { width: 1.6em; height: 1.6em; }

.dock {
  position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(80, 50, 30, .07);
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
}
.dock-in { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }
.count-row { display: flex; align-items: center; gap: 10px; }
.count { font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.count small { font-size: .875rem; font-weight: 600; color: var(--muted); }
.count.pop { animation: pop .25s ease; }
@keyframes pop { 40% { transform: scale(1.25); } }
.count-row .bar { flex: 1; }
.dock-btns { display: grid; grid-template-columns: 68px minmax(0, 1fr) 68px; gap: 8px; }
.nav-side { min-height: 60px; border-radius: 14px; font-size: .75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; padding: 2px; box-shadow: inset 0 0 0 1.5px var(--line); }
.nav-side:disabled { opacity: .4; }
.nav-side.is-next { background: var(--good); color: #fff; box-shadow: none; }
.plus { min-height: 60px; font-size: 1.125rem; }
.plus-idle { background: var(--ink); color: #fff; }
.plus-soft { background: #F2EBE3; color: var(--ink); }

/* --- Luyện nói tự động: mỗi trạng thái có màu và biểu tượng riêng --- */
.status { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 700; text-align: center; }
.st-idle { background: #F2EBE3; color: var(--ink); }
.st-model { background: #E4ECFD; color: #1E3A8A; }
.st-turn { background: var(--primary); color: #fff; }
.st-listen { background: var(--primary-soft); color: #6E2415; box-shadow: inset 0 0 0 2px var(--primary); }
.st-listen svg.ic { animation: pulse 1.1s infinite; }
.st-near { background: var(--warn-soft); color: #5F3A00; }
.st-wrong { background: #F5E6F2; color: #6B2160; }
.st-good { background: var(--good); color: #fff; animation: pop .3s ease; }
.st-move { background: var(--good-soft); color: #084C46; }
.st-pause { background: #E9EDF2; color: var(--ink); }
.st-bad { background: var(--danger-soft); color: #7A1A12; }
.sentence .ipa { margin-top: 2px; color: var(--muted); font-family: "Segoe UI", "Lucida Sans Unicode", "Noto Sans", "DejaVu Sans", var(--font); }
.live { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
canvas.wave { width: 100%; height: 44px; display: block; background: #FBF4EC; border-radius: 12px; }
.fake-wave { height: 44px; display: flex; align-items: center; justify-content: center; gap: 5px; background: #FBF4EC; border-radius: 12px; }
.fake-wave i { width: 5px; height: 10px; border-radius: 3px; background: var(--primary); opacity: .35; }
.fake-wave.on i { opacity: 1; animation: waveBar .8s ease-in-out infinite; }
.fake-wave i:nth-child(2) { animation-delay: .1s; } .fake-wave i:nth-child(3) { animation-delay: .2s; }
.fake-wave i:nth-child(4) { animation-delay: .3s; } .fake-wave i:nth-child(5) { animation-delay: .4s; }
@keyframes waveBar { 50% { height: 32px; } }
.interim { min-height: 1.5em; text-align: center; font-size: 1.0625rem; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.compare { display: grid; gap: 6px; font-size: .9375rem; }
.compare b { display: block; font-size: .8125rem; font-weight: 600; color: var(--muted); }
.compare span { font-weight: 600; overflow-wrap: anywhere; }
.lesson-dock .tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tool { min-height: 58px; border-radius: 14px; font-size: .8125rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; box-shadow: inset 0 0 0 1.5px var(--line); }
.tool:disabled { opacity: .4; }
.lesson-pad { padding-bottom: 110px; }
.first-note { text-align: center; font-size: .875rem; color: var(--muted); }


/* --- Đăng nhập, bạn bè, lộ trình --- */
.auth-box { max-width: 420px; margin: 0 auto; padding-top: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.auth-logo { width: 64px; height: 64px; margin: 0 auto; border-radius: 20px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 2rem; font-weight: 800; }
.field { display: grid; gap: 4px; font-weight: 600; font-size: .9375rem; }
input:not([type=checkbox]) { font: inherit; width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #D9C8B6; background: var(--surface); color: var(--ink); min-width: 0; }
.input-grow { flex: 1; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-soft); display: grid; place-items: center; font-size: 1.5rem; flex: none; }
.small-av { width: 38px; height: 38px; font-size: 1.1875rem; }
.big-av { width: 68px; height: 68px; font-size: 2.125rem; }
.avatar-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.avatar-pick button { min-height: 48px; font-size: 1.5rem; border-radius: 12px; background: var(--bg); }
.avatar-pick button[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--primary); background: var(--primary-soft); }
.bar.on-dark { background: rgba(255, 255, 255, .25); }
.bar.on-dark > i { background: #fff; }
.tiles-2 { grid-template-columns: 1fr 1fr; }
.tile b { overflow-wrap: anywhere; }
.tiles-2 .tile b { font-size: 1.25rem; }
.friend-line { min-height: 48px; }
.friend-card { display: block; padding: 10px 0; border-top: 1px solid var(--line); }
.friend-card:first-of-type { border-top: 0; padding-top: 0; }
.link-more { font-weight: 600; color: var(--primary-dark); min-height: 32px; display: inline-flex; align-items: center; }
.level-locked { opacity: .72; background: #FBF4EC; box-shadow: none; }
.step-no { width: 34px; height: 34px; border-radius: 50%; background: #F3E7DA; display: grid; place-items: center; font-weight: 800; flex: none; }
.step-no.ok { background: var(--good); color: #fff; }
.score { font-size: 3rem; font-weight: 800; line-height: 1.2; }
.rank-line { padding: 8px 6px; border-radius: 12px; }
.rank-line.is-me { background: var(--primary-soft); }
.rank-no { width: 22px; text-align: center; flex: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; cursor: pointer; }
.toggle input { width: 24px; height: 24px; flex: none; accent-color: var(--primary); }
.unread { font-weight: 700; }
.choice { line-height: 1.35; }
#nav .links { grid-template-columns: repeat(5, 1fr); }
#nav a.link { font-size: .75rem; }
@media (min-width: 960px) { #nav .links { grid-template-columns: 1fr; } #nav a.link { font-size: 1rem; } }

/* --- Tô màu từ, hội thoại, ôn theo lịch --- */

.bubble.mine { justify-self: end; border-radius: 16px 16px 4px 16px; background: var(--primary-soft); }

/* --- Flashcard --- */
.fc-scene { perspective: 1200px; }
.fc { display: grid; width: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, .7, .3, 1); cursor: pointer; animation: fadeUp .25s ease-out; }
.fc.flipped { transform: rotateY(180deg); }
.fc-face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); min-height: 320px; padding: 22px 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px;
}
.fc-back { transform: rotateY(180deg); }
.fc .word { font-size: 2.5rem; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; letter-spacing: -.01em; }
.fc .ipa { font-family: "Segoe UI", "Lucida Sans Unicode", "Noto Sans", "DejaVu Sans", var(--font); font-size: 1.25rem; color: var(--muted); }
.fc .mean { font-size: 1.75rem; font-weight: 800; color: var(--primary-dark); }
.fc .ex { font-size: 1.125rem; font-weight: 600; }
.fc-pad { padding-bottom: 104px; display: grid; gap: 12px; }
.review-q { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.review-q:first-of-type { border-top: 0; padding-top: 0; }
.review-q svg.ic { width: 1em; height: 1em; vertical-align: -1px; }
.review-q .btn { justify-self: start; min-height: 44px; padding: 6px 14px; }
.dock-simple .two .btn { min-height: 60px; }

/* --- Thử thách --- */
.timer { text-align: center; font-size: 3rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--danger); }
.ch-stats { display: flex; justify-content: center; gap: 18px; font-weight: 600; color: var(--muted); font-size: .9375rem; }
.ch-stats b { color: var(--ink); }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; min-height: 64px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); }
.choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--primary); background: var(--primary-soft); font-weight: 700; }
.choice .topic-ico { width: 44px; height: 44px; font-size: 1.375rem; border-radius: 12px; background: var(--bg); }
.result-num { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* --- Tiến độ & biểu đồ 7 ngày --- */
.chart { position: relative; height: 150px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; padding-bottom: 24px; }
.chart .col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-radius: 6px; outline-offset: 0; }
.chart .fill { width: min(26px, 70%); background: var(--primary); border-radius: 4px 4px 0 0; min-height: 0; }
.chart .fill.zero { height: 2px !important; background: var(--line); border-radius: 2px; }
.chart .lb { position: absolute; bottom: -24px; font-size: .75rem; color: var(--muted); line-height: 24px; }
.chart .col.today .lb { color: var(--ink); font-weight: 700; }
.chart .val { font-size: .75rem; font-weight: 700; line-height: 1.5; }
/* Tooltip chỉ chiếm chỗ khi hiện; cột nửa trái canh trái, cột nửa phải canh phải để không tràn màn hình */
.chart .tip { display: none; position: absolute; bottom: calc(100% - 30px); left: 0; width: max-content; max-width: 170px; background: var(--ink); color: #fff; padding: 5px 8px; border-radius: 8px; font-size: .75rem; pointer-events: none; z-index: 2; }
.chart .col:nth-child(n+5) .tip { left: auto; right: 0; }
.chart .col:hover .tip, .chart .col:focus .tip { display: block; }
.chart .goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed #B9A895; pointer-events: none; }
.chart .goal-line span { position: absolute; right: 0; top: -19px; font-size: .75rem; color: var(--muted); background: var(--surface); padding: 0 4px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { text-align: center; padding: 10px 4px; border-radius: 14px; background: var(--bg); }
.badge .e { font-size: 1.875rem; line-height: 1.2; }
.badge p { font-size: .8125rem; font-weight: 600; line-height: 1.25; margin-top: 4px; }
.badge small { display: block; font-size: .75rem; color: var(--muted); margin-top: 2px; }
.badge.off .e { filter: grayscale(1); opacity: .35; }
.badge.off p { color: var(--muted); font-weight: 500; }
.device { display: flex; gap: 8px; align-items: flex-start; font-size: .9375rem; }
.device .ok { color: var(--good); }
.device .no { color: var(--danger); }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   PHẦN 1: CẤU HÌNH
   Hai giá trị dưới đây được phép công khai; dữ liệu được bảo vệ bằng phân quyền trên máy chủ.
   Tuyệt đối không đưa khóa service_role hoặc secret vào file này.
   ============================================================ */
const SUPABASE_URL = "https://fpwsxybxwomgdjlkwkpj.supabase.co";
const SUPABASE_KEY = "sb_publishable_RP-CYoUBywf59qHv-_5_uA_J4XKxxo0";
const VAPID_PUBLIC_KEY = "BOOAb2t5EAENdkj0xqdKBTwU_E-CDCI4LGYOrnPgrrULOZrgqbWit1M97-3gd5ux_CnEr1Fxqu6znrWtQQf65xE"; // khóa công khai để nhận thông báo nhắc học
const LOGIN_DOMAIN = "anna-english.invalid"; // Supabase cần email nên tạo địa chỉ nội bộ từ tên đăng nhập, không gửi thư
const PREF_KEY = "annaEnglish.prefs";
const OUTBOX_KEY = "annaEnglish.outbox";
const SPEEDS = {
  slow: { label: "Chậm 0.7x", rate: 0.7 },
  normal: { label: "Vừa 1.0x", rate: 1.0 },
  fast: { label: "Nhanh 1.2x", rate: 1.2 }
};
const MAX_RECORD_SECONDS = 60;
const LOUD_TARGET = 0.6;
const QUIET_LEVEL = 0.12;
const AVATARS = ["🐼", "🦊", "🐯", "🐸", "🐧", "🦉", "🐶", "🐱", "🦄", "🌟"];

/* ============================================================
   PHẦN 2: DỮ LIỆU TRONG BỘ NHỚ
   Nội dung và tiến độ luôn lấy từ máy chủ; localStorage chỉ giữ tùy chọn hiển thị
   và các lượt nói chưa gửi được khi mất mạng.
   ============================================================ */
let sb = null;
let me = null;          // hồ sơ của người đang đăng nhập
let LEVELS = [];
let TOPICS = [];
let levelRows = {};     // id level -> dòng level_progress (không có nghĩa là đang khóa)
let topicRows = {};     // id chủ đề -> dòng topic_results
let achievementsAll = [];
let dialogueDone = {};  // id hội thoại -> số lần đã hoàn thành
const state = { sp: {}, words: {}, speed: "normal", showVi: true, seenGuide: false, scale: "md" };

function loadPrefs() {
  try { Object.assign(state, JSON.parse(localStorage.getItem(PREF_KEY) || "{}"), { sp: {}, words: {} }); } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({ speed: state.speed, showVi: state.showVi, seenGuide: state.seenGuide, scale: state.scale }));
  } catch (e) {}
}
const dateKey = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const daysAgo = (n) => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate() - n); };
const topicById = (id) => TOPICS.find((t) => t.id === id);
const levelById = (id) => LEVELS.find((l) => l.id === id);
const sKey = (tid, i) => `${tid}:${i}`;
const spOf = (tid, i) => state.sp[sKey(tid, i)] || null;
const isDone = (tid, i) => !!(spOf(tid, i) && spOf(tid, i).completedAt);
const needsReview = (tid, i) => { const r = spOf(tid, i); return !!r && (r.review || r.status === "review"); };
const isOpen = (tid, i) => { const r = spOf(tid, i); return !r || (!r.completedAt && r.status !== "review"); };
const reviewList = (t) => t.sentences.map((_, i) => i).filter((i) => needsReview(t.id, i))
  .sort((a, b) => (spOf(t.id, b).attempts || 0) - (spOf(t.id, a).attempts || 0));
const doneInTopic = (t) => t.sentences.filter((_, i) => isDone(t.id, i)).length;
const isKnown = (tid, i) => (state.words[sKey(tid, i)] || {}).status === "known";
const knownInTopic = (t) => t.words.filter((_, i) => isKnown(t.id, i)).length;
const topicPercent = (t) => (t.sentences.length ? Math.round(doneInTopic(t) / t.sentences.length * 100) : 0);
/* Câu đã học đến hạn ôn hôm nay */
const dueList = (t) => t.sentences.map((_, i) => i).filter((i) => { const r = spOf(t.id, i); return r && r.completedAt && r.nextReview && r.nextReview <= dateKey(); });
const dueCount = () => openTopics().reduce((n, t) => n + dueList(t).length, 0);
const levelUnlocked = (id) => !!levelRows[id];
const topicUnlocked = (t) => levelUnlocked(t.level_id);
const topicComplete = (t) => !!(topicRows[t.id] && topicRows[t.id].completed_at);
const topicsOfLevel = (id) => TOPICS.filter((t) => t.level_id === id);
const openTopics = () => TOPICS.filter(topicUnlocked);
const wordsNeeded = (t) => Math.ceil(t.words.length * 0.8);
function levelPercent(id) {
  const ts = topicsOfLevel(id);
  return ts.length ? Math.round(ts.filter(topicComplete).length / ts.length * 100) : 0;
}
function levelState(id) {
  const r = levelRows[id];
  if (!r) return "locked";
  return r.status;
}
function currentLevelId() {
  const open = LEVELS.filter((l) => levelRows[l.id]);
  const going = open.find((l) => levelRows[l.id].status !== "completed");
  return (going || open[open.length - 1] || LEVELS[0] || {}).id;
}
function learningWords() {
  const list = [];
  openTopics().forEach((t) => t.words.forEach((_, i) => {
    if ((state.words[sKey(t.id, i)] || {}).status === "learning") list.push({ t, i });
  }));
  return list;
}
/* Việc nên làm tiếp: câu chưa xong, rồi từ vựng và bài kiểm tra của chủ đề, rồi bài kiểm tra level */
function resumeTarget() {
  const lv = currentLevelId();
  const ts = topicsOfLevel(lv);
  if (!ts.length) return { href: "#/path", label: "Xem lộ trình", note: "Nội dung level này đang được soạn" };
  const t = ts.find((x) => !topicComplete(x));
  if (!t) return { href: `#/level/${lv}`, label: "Làm bài kiểm tra level", note: `Bạn đã xong mọi chủ đề của ${levelById(lv).code}` };
  const i = t.sentences.findIndex((_, x) => isOpen(t.id, x));
  if (i >= 0) return { href: `#/practice/${t.id}/${i}`, label: "Tiếp tục học", note: `${t.icon} ${t.title_vi} · Câu ${i + 1}/${t.sentences.length}`, t };
  return { href: `#/topic/${t.id}`, label: "Tiếp tục học", note: `${t.icon} ${t.title_vi}`, t };
}

/* ============================================================
   PHẦN 2A: KẾT NỐI MÁY CHỦ
   ============================================================ */
const usernameToEmail = (u) => `${u}@${LOGIN_DOMAIN}`;
const ERROR_TEXT = {
  LEVEL_LOCKED: "Level này chưa mở khóa.",
  TOPICS_INCOMPLETE: "Bạn cần hoàn thành mọi chủ đề của level trước khi làm bài kiểm tra.",
  NO_QUESTIONS: "Chưa có câu hỏi cho bài này.",
  NOT_FRIENDS: "Hai bạn chưa kết bạn.",
  REQUEST_NOT_FOUND: "Lời mời này không còn hiệu lực.",
  USER_NOT_FOUND: "Không tìm thấy người này."
};
function errorText(e) {
  const m = (e && e.message) || "";
  const code = Object.keys(ERROR_TEXT).find((k) => m.includes(k));
  if (code) return ERROR_TEXT[code];
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Không kết nối được máy chủ. Hãy kiểm tra Internet rồi thử lại.";
  return "Đã có lỗi xảy ra. Hãy thử lại.";
}
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw error;
  return data;
}
async function rows(query) {
  const { data, error } = await query;
  if (error) throw error;
  return data || [];
}
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));

/* Hàng đợi ghi: mất mạng vẫn không mất lượt nói, có mạng lại thì gửi tiếp.
   Mã lượt nói cố định nên gửi lại cũng không bị tính hai lần. */
const Outbox = {
  items: [], busy: false,
  load() {
    try { this.items = JSON.parse(localStorage.getItem(OUTBOX_KEY + "." + me.id) || "[]"); } catch (e) { this.items = []; }
  },
  persist() {
    try { localStorage.setItem(OUTBOX_KEY + "." + me.id, JSON.stringify(this.items)); } catch (e) {}
  },
  push(name, args) {
    this.items.push({ name, args });
    this.persist();
    return this.flush();
  },
  async flush() {
    if (this.busy || !sb) return;
    this.busy = true;
    try {
      while (this.items.length) {
        const { name, args } = this.items[0];
        const { error } = await sb.rpc(name, args);
        // Lỗi mạng thì dừng để thử lại sau; lỗi nghiệp vụ thì bỏ, vì gửi lại cũng không thành công
        if (error && /fetch|network/i.test(error.message || "")) return;
        this.items.shift();
        this.persist();
      }
    } catch (e) { /* mất mạng: giữ nguyên hàng đợi */ }
    finally { this.busy = false; }
  }
};
window.addEventListener("online", () => Outbox.flush());

async function loadContent() {
  const [levels, topics, sentences, vocab, ach, dialogues, lines] = await Promise.all([
    rows(sb.from("levels").select("*").order("id")),
    rows(sb.from("topics").select("*").order("position")),
    rows(sb.from("sentences").select("*, lessons!inner(topic_id)").order("position")),
    rows(sb.from("vocabulary").select("*").order("position")),
    rows(sb.from("achievements").select("*")),
    rows(sb.from("dialogues").select("*")),
    rows(sb.from("dialogue_lines").select("*").order("position"))
  ]);
  LEVELS = levels;
  achievementsAll = ach;
  TOPICS = topics.map((t) => ({
    ...t,
    sentences: sentences.filter((s) => s.lessons.topic_id === t.id),
    words: vocab.filter((v) => v.topic_id === t.id).map((v) => ({ ...v, ex: v.example, exVi: v.example_vi })),
    dialogue: (() => {
      const d = dialogues.find((x) => x.topic_id === t.id);
      return d ? { ...d, lines: lines.filter((l) => l.dialogue_id === d.id) } : null;
    })()
  }));
}
async function loadProgress() {
  const [prog, words, tr, lv, dp] = await Promise.all([
    rows(sb.from("user_progress").select("*").eq("user_id", me.id)),
    rows(sb.from("user_vocabulary").select("*").eq("user_id", me.id)),
    rows(sb.from("topic_results").select("*").eq("user_id", me.id)),
    rows(sb.from("level_progress").select("*").eq("user_id", me.id)),
    rows(sb.from("dialogue_progress").select("*").eq("user_id", me.id))
  ]);
  dialogueDone = Object.fromEntries(dp.map((r) => [r.dialogue_id, r.times]));
  state.sp = {}; state.words = {};
  const sIndex = {}, wIndex = {};
  TOPICS.forEach((t) => {
    t.sentences.forEach((s, i) => { sIndex[s.id] = sKey(t.id, i); });
    t.words.forEach((w, i) => { wIndex[w.id] = sKey(t.id, i); });
  });
  prog.forEach((r) => {
    if (sIndex[r.sentence_id]) state.sp[sIndex[r.sentence_id]] = {
      status: r.status, attempts: r.attempts, successes: r.successes, firstResult: r.first_result,
      completedAt: r.completed_at, lastHeard: r.last_heard, review: r.needs_review, seconds: 0, nextReview: r.next_review_on
    };
  });
  words.forEach((r) => {

   So sánh theo từ (Levenshtein), từ gần giống chỉ tính một phần lỗi,

const ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
const TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
function numberToWords(n) {
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "");
  if (n < 1000) return ONES[Math.floor(n / 100)] + " hundred" + (n % 100 ? " " + numberToWords(n % 100) : "");
  if (n < 1000000) return numberToWords(Math.floor(n / 1000)) + " thousand" + (n % 1000 ? " " + numberToWords(n % 1000) : "");
  return String(n);
}
const CONTRACTIONS = {
  "i'm": "i am", "you're": "you are", "we're": "we are", "they're": "they are", "he's": "he is", "she's": "she is", "it's": "it is",
  "what's": "what is", "where's": "where is", "here's": "here is", "that's": "that is", "how's": "how is",
  "don't": "do not", "doesn't": "does not", "can't": "can not", "cannot": "can not", "isn't": "is not", "aren't": "are not",
  "i'd": "i would", "i'll": "i will", "you'll": "you will", "we'll": "we will", "i've": "i have", "o'clock": ""
};
/* Từ đồng âm: bộ nhận diện không phân biệt được nên không tính là lỗi của người học */
const HOMOPHONES = {
  meat: "meet", two: "to", too: "to", buy: "by", bye: "by", sea: "see", sun: "son", their: "there", they: "they", hear: "here", blew: "blue",
  won: "one", wear: "where", hour: "our", ate: "eight", sum: "some", write: "right", red: "red", read: "red", four: "for", tea: "tea"
};
const STOP_WORDS = new Set(["a", "an", "the", "is", "am", "are", "to", "at", "in", "of", "by", "do", "does", "and", "very", "please", "i", "it", "this", "you", "your", "my", "our", "we"]);
function normalizeSpeech(text) {
  let t = String(text).toLowerCase().replace(/[’‘`]/g, "'");
  t = t.replace(/\b(\d{1,2}):00\b/g, "$1").replace(/\bt\.?\s?v\.?(?=\s|$)/g, "tv");
  t = t.replace(/\bgood bye\b/g, "goodbye").replace(/\bviet nam\b/g, "vietnam").replace(/\bo clock\b/g, "");
  t = t.split(/\s+/).map((w) => {
    const clean = w.replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
    return CONTRACTIONS[clean] !== undefined ? CONTRACTIONS[clean] : clean;
  }).join(" ");
  t = t.replace(/\$(\d[\d,]*)/g, "$1 dollars").replace(/(\d),(?=\d{3})/g, "$1").replace(/\b\d+\b/g, (n) => numberToWords(Number(n))).replace(/[^a-z0-9\s]/g, " ");
  return t.split(/\s+/).filter(Boolean).map((w) => (w === "goodbye" ? w : HOMOPHONES[w] || w));
}
function charDistance(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}
/* Từ khác nhau từ một nửa số chữ trở lên được tính là sai hẳn một từ */
function wordCost(a, b) {
  if (a === b) return 0;
  const ratio = charDistance(a, b) / Math.max(a.length, b.length);
  return ratio >= 0.5 ? 1 : ratio;
}
/* Sai từ không mang nghĩa (a, the, my…) chỉ tính nửa lỗi; nếu không, câu ngắn sai một từ nhỏ sẽ không bao giờ đạt mức "gần đúng" */
const wordWeight = (w) => (STOP_WORDS.has(w) ? 0.5 : 1);
function wordSimilarity(said, target) {
  const row = [0];
  for (let j = 1; j <= target.length; j++) row[j] = row[j - 1] + wordWeight(target[j - 1]);
  for (let i = 1; i <= said.length; i++) {
    let prev = row[0];
    row[0] += wordWeight(said[i - 1]);
    for (let j = 1; j <= target.length; j++) {
      const tmp = row[j];
      const swap = wordCost(said[i - 1], target[j - 1]) * wordWeight(target[j - 1]);
      row[j] = Math.min(row[j] + wordWeight(said[i - 1]), row[j - 1] + wordWeight(target[j - 1]), prev + swap);
      prev = tmp;
    }
  }
  const longest = Math.max(said.length, target.length);
  return longest ? 1 - row[target.length] / longest : 0;
}
function missingKeywords(said, sentence, targetWords) {
  const keys = sentence.keywords && sentence.keywords.length ? sentence.keywords.flatMap(normalizeSpeech) : targetWords.filter((w) => !STOP_WORDS.has(w));
  return keys.filter((k) => !said.some((w) => w === k || (k.length > 3 && wordCost(w, k) <= 0.25)));
}
/* Kết quả: { level: "correct" | "near" | "wrong", score } */
function gradeSpeech(text, sentence) {
  const said = normalizeSpeech(text);
  const main = normalizeSpeech(sentence.en);
  const accepted = [main, ...(sentence.accepts || []).map(normalizeSpeech)];
  if (accepted.some((w) => w.join(" ") === said.join(" ") && w.length)) return { level: "correct", score: 1 };
  const score = wordSimilarity(said, main);
  const missing = missingKeywords(said, sentence, main);
  if (score >= 0.95 && !missing.length) return { level: "correct", score };
  if (score >= 0.85 && !missing.length) return { level: "near", score };
  return { level: "wrong", score };
}

  speak(text, rate, onState = () => {}) {

      delay = setTimeout(() => {

        } catch (e) { finish("error"); }

/* --- Micro: đo âm lượng bằng AnalyserNode và ghi âm bằng MediaRecorder --- */
const Mic = {
  session: null,
  canUseMic: () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
  canMeasure: () => !!(window.AudioContext || window.webkitAudioContext),
  canRecord: () => typeof window.MediaRecorder === "function",
  pickMime() {

      .find((m) => MediaRecorder.isTypeSupported(m)) || "";
  },
  /* cb gồm: onLive({ measuring, recording }), onLevel(0..1), onDone({ url }), onError(mã lỗi) */
  async start(cb) {

    const session = { cb, cancelled: false, stream: null, ctx: null, rec: null, chunks: [], raf: 0, discard: false };

      // Chỉ xin quyền micro tại đây, tức là sau khi người dùng đã bấm "Nói theo"
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }

    } catch (e) {

        NotAllowedError: "denied", PermissionDeniedError: "denied", SecurityError: "denied",
        NotFoundError: "nomic", DevicesNotFoundError: "nomic", OverconstrainedError: "nomic",
        NotReadableError: "busy", TrackStartError: "busy", AbortError: "busy"

    }
    // Người dùng đã rời màn hình trong lúc chờ cấp quyền: trả micro ngay
    if (session.cancelled) { stream.getTracks().forEach((tr) => tr.stop()); return; }
    session.stream = stream;

    const live = { measuring: false, recording: false };
    try { live.measuring = this.startMeter(session); } catch (e) { live.measuring = false; }
    try { live.recording = cb.meterOnly ? false : this.startRecorder(session); } catch (e) { live.recording = false; }
    cb.onLive(live);
  },
  startMeter(session) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    const ctx = new Ctx();
    session.ctx = ctx;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    // Không nối tới loa để tránh tiếng vọng
    ctx.createMediaStreamSource(session.stream).connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);
    const loop = () => {
      if (this.session !== session) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; sum += x * x; }
      const rms = Math.sqrt(sum / buf.length);
      // Đổi sang decibel rồi quy về 0–1: −55 dB là im lặng, −15 dB là rất to
      const db = 20 * Math.log10(rms || 1e-6);

/* Hiệu ứng pháo giấy nhẹ, không chạy nếu người dùng tắt chuyển động */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70";
  c.width = innerWidth; c.height = innerHeight;
  document.body.appendChild(c);
  const g = c.getContext("2d");
  const colors = ["#C2412D", "#F2A541", "#0B6B63", "#FDEBE4"];
  const parts = Array.from({ length: 70 }, () => ({
    x: c.width / 2, y: c.height * .45,
    vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 3,
    s: 5 + Math.random() * 5, r: Math.random() * 6, col: colors[Math.floor(Math.random() * 4)]
  }));
  const start = performance.now();
  (function frame(now) {
    const t = now - start;
    g.clearRect(0, 0, c.width, c.height);
    g.globalAlpha = Math.max(0, 1 - t / 1500);
    parts.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.vy += .32; p.r += .15;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col;
      g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore();
    });
    if (t < 1500) requestAnimationFrame(frame); else c.remove();
  })(start);
}

/* Hẹn giờ gắn với lượt chạy hiện tại: bị hủy tự động khi lượt đó kết thúc */
function later(fn, ms) {
  const owner = P, run = P.run;
  const id = setTimeout(() => { if (P === owner && P.run === run) fn(); }, ms);
  P.timers.push(id);
}
/* Dừng mọi thứ đang chạy: giọng mẫu, nhận diện, micro và hẹn giờ */
function interrupt() {
  if (!P) return;
  P.run++;
  P.timers.forEach(clearTimeout);
  P.timers = [];
  Recog.stop();
  if (P.voiceAudio) { P.voiceAudio.pause(); P.voiceAudio = null; }
  if (P.mic !== "recording") Mic.stop(!P.keepVoice);
  P.meterOn = false;
  Speech.cancel();
}
/* Xin quyền micro bằng thao tác chủ động của người dùng, sau đó nhả micro ngay */
async function ensureMic() {
  if (micReady) return true;
  try {
    if (navigator.permissions && navigator.permissions.query) {
      const st = await navigator.permissions.query({ name: "microphone" });
      if (st.state === "granted") { micReady = true; return true; }
    }
  } catch (e) { /* trình duyệt không hỗ trợ truy vấn quyền: đi tiếp bên dưới */ }
  if (!Mic.canUseMic()) {
    // Safari cũ có nhận diện nhưng không có getUserMedia: để bộ nhận diện tự xin quyền
    if (window.isSecureContext === false) throw "insecure";
    micReady = true;
    return true;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((tr) => tr.stop());
    micReady = true;
    return true;
  } catch (e) {
    const map = { NotAllowedError: "denied", PermissionDeniedError: "denied", SecurityError: "denied", NotFoundError: "nomic", DevicesNotFoundError: "nomic", NotReadableError: "busy", TrackStartError: "busy" };
    throw map[e && e.name] || "unknown";
  }
}
function showError(code) {
  if (!P) return;
  interrupt();
  P.feedback = null;
  P.errCode = code;
  setPhase("error");
}
/* Thao tác duy nhất người học cần làm: nhấn Nghe mẫu hoặc Tiếp tục */
async function startLesson() {
  if (!P) return;
  if (P.mic === "recording") stopMic();
  if (P.solved) { advance(); return; }
  autoRun = true;
  interrupt();
  const owner = P, run = P.run;
  if (!micReady) setPhase("perm");
  try { await ensureMic(); }
  catch (code) { if (P === owner && P.run === run) showError(code); return; }
  if (P === owner && P.run === run) playModel();
}
function playModel() {
  if (!P) return;
  interrupt();
  P.note = null;
  setPhase("model");
  const owner = P, run = P.run;
  Speech.speak(P.s.en, SPEEDS[state.speed].rate).then((r) => {
    if (P !== owner || P.run !== run) return;
    if (r === "canceled") return;
    if (r === "error") P.note = SPEECH_FAILED;
    if (r === "unsupported") P.note = SPEECH_UNSUPPORTED;
    // Chờ một nhịp để micro không thu phải đuôi giọng mẫu
    later(goListen, 250);
  });
}
function goListen() {
  if (!P) return;
  interrupt();
  markActive();
  P.interim = "";
  P.nudge = false;
  P.history = new Array(36).fill(0);
  P.meterOn = meterAllowed && Mic.canUseMic() && Mic.canMeasure();
  setPhase("turn");
  later(() => { P.nudge = true; syncLesson(); }, SILENCE_NUDGE_MS);
  if (P.meterOn) startWave();
  const owner = P, run = P.run;
  const stale = () => P !== owner || P.run !== run;
  Recog.start({
    onSpeech() {
      if (stale()) return;
      markActive();
      P.nudge = false;
      if (P.phase === "turn") setPhase("listening");
      else syncLesson();
    },
    onInterim(text) {
      if (stale()) return;
      P.interim = text;
      P.nudge = false;
      if (P.feedback) { P.feedback = null; syncLive(); }
      if (P.phase !== "listening") setPhase("listening");
      const el = $("#interim");
      if (el) el.textContent = text;
    },
    onFinal(alts) { if (!stale()) judge(alts); },
    onError(code) {
      if (stale()) return;
      if (code === "no-speech") { P.endReason = "silent"; return; }
      if (code === "audio-capture" && P.meterOn) {
        // Micro không phục vụ được cả hai nơi: bỏ đo âm lượng, giữ nhận diện
        meterAllowed = false;
        later(goListen, 300);
        P.endReason = "retry";
        return;
      }
      const map = { "not-allowed": "denied", "service-not-allowed": "service", "audio-capture": "nomic", network: "network", "language-not-supported": "service", "start-failed": "unknown" };
      if (code === "not-allowed") micReady = false;
      showError(map[code] || "unknown");
    },
    onEnd() {
      if (stale()) return;
      const reason = P.endReason;
      P.endReason = null;
      if (reason === "retry") return;
      if (P.interim) {
        // Chỉ có kết quả tạm mà không có kết quả cuối: không chấm, nhờ nói lại

function startWave() {
  const owner = P;
  Mic.start({
    meterOnly: !Mic.canRecord(),
    onLive() {},
    onLevel(level) { if (P === owner) drawWave(level); },
    onDone({ url }) {
      if (P !== owner) { if (url) URL.revokeObjectURL(url); return; }
      if (!url) return;
      if (P.voiceUrl) URL.revokeObjectURL(P.voiceUrl);
      P.voiceUrl = url;

    onError() {}
  });
}
function drawWave(level) {
  const c = $("#wave");
  if (!c || !c.width) return;
  const g = c.getContext("2d");
  const w = c.width, h = c.height, bars = 36, hist = P.history;
  hist.push(level);
  if (hist.length > bars) hist.shift();
  g.clearRect(0, 0, w, h);
  g.fillStyle = "#C2412D";
  const bw = w / bars;
  hist.forEach((lv, i) => {
    const bh = Math.max(3, lv * h);
    g.fillRect((bars - hist.length + i) * bw + bw * .18, (h - bh) / 2, bw * .64, bh);

/* Chấm kết quả cuối, chọn phương án nhận diện có lợi nhất cho người học */
function judge(alts) {
  if (P.solved) return;
  const rank = { wrong: 0, near: 1, correct: 2 };
  let best = null;
  alts.forEach((text) => {
    const g = gradeSpeech(text, P.s);
    if (!best || rank[g.level] > rank[best.level] || (rank[g.level] === rank[best.level] && g.score > best.score)) best = { ...g, heard: text.trim() };
  });
  P.keepVoice = true;   // giữ lại bản ghi của lượt này để người học nghe lại
  interrupt();
  P.keepVoice = false;
  if (!best || !best.heard) { P.note = "Mình chưa nghe rõ, hãy thử lại"; later(goListen, 900); syncLive(); return; }
  markActive();
  P.silentRounds = 0;
  P.note = null;
  P.interim = "";
  const rec = P.rec;
  rec.attempts++;
  P.sessionAttempts++;
  rec.lastHeard = best.heard;
  if (!rec.firstResult) rec.firstResult = best.level;
  practiceSessionReps++;
  Outbox.push("record_attempt", { p_attempt_id: newId(), p_sentence: P.s.id, p_heard: best.heard, p_result: best.level, p_score: best.score, p_session_attempts: P.sessionAttempts });
  if (best.level === "correct") {
    P.solved = true;
    rec.successes++;
    if (!rec.completedAt) rec.completedAt = Date.now();
    rec.status = "done";
    rec.review = P.sessionAttempts > 1;
    rec.nextReview = dateKey(daysAgo(-1)); // máy chủ tính ngày chính xác, lần tải sau sẽ cập nhật
    P.feedback = null;
    confetti();
    vibrate(20);
    setPhase("correct");
    later(() => { setPhase("moving"); later(advance, 350); }, 1000);
    return;
  }
  rec.review = true;
  P.feedback = best;
  setPhase(best.level);
  later(goListen, best.level === "near" ? 2400 : 3200);
}
/* Câu tiếp theo tùy lượt học; không còn câu thì sang màn hình chúc mừng */
function nextIndex() {

function drawMeter(level) {
  const c = $("#meter");
  if (!c || !c.width) return;
  const g = c.getContext("2d");
  const w = c.width, h = c.height;
  const hist = P.history;
  const bars = 36;
  hist.push(level);
  if (hist.length > bars) hist.shift();
  g.clearRect(0, 0, w, h);
  const bw = w / bars;
  hist.forEach((lv, i) => {
    const bh = Math.max(3, lv * h);
    g.fillStyle = lv >= LOUD_TARGET ? "#0B6B63" : "#C2412D";
    g.globalAlpha = lv >= LOUD_TARGET ? 1 : .7;
    const x = (bars - hist.length + i) * bw;
    g.fillRect(x + bw * .18, h - bh, bw * .64, bh);
  });
  g.globalAlpha = 1;
  const y = h - LOUD_TARGET * h;
  g.strokeStyle = "#1F2A37";
  g.lineWidth = Math.max(1, (window.devicePixelRatio || 1) * 1.2);
  g.setLineDash([6, 5]);
  g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
  g.setLineDash([]);
}

  drawMeter(level);
  const now = performance.now();
  if (level >= LOUD_TARGET) { P.goodUntil = now + 700; P.loudSeen = true; }
  const next = now < P.goodUntil ? "good" : level >= QUIET_LEVEL ? "low" : "quiet";
  if (next !== P.meter) {
    P.meter = next;
    const el = $("#meterStatus");
    if (el) {
      el.dataset.s = next;
      el.innerHTML = next === "good" ? `${ic("check")}Tốt lắm! Đủ to rồi.`
        : next === "low" ? `${ic("sound")}Nói to hơn!`
        : `${ic("mic")}Mình đang nghe, hãy nói đi!`;
    }
  }
}
function startMic() {

  Speech.cancel();
  stopPlayback();
  clearRecording();
  P.mic = "requesting";
  P.loudSeen = false; P.history = []; P.meter = "quiet"; P.seconds = 0;
  syncSpeak();
  const owner = P;
  Mic.start({
    onLive(live) {
      if (P !== owner) return;
      if (!live.measuring && !live.recording) {
        Mic.stop(true);
        P.mic = "error"; P.micErr = "unsupported";

        return;
      }
      P.live = live;
      P.mic = "recording";
      P.seconds = 0;
      P.timer = setInterval(() => {
        if (P !== owner) return;
        P.seconds++;
        markActive();
        const el = $("#recTime");

        if (P.seconds >= MAX_RECORD_SECONDS) { toast("Đã tự dừng sau 1 phút."); stopMic(); }
      }, 1000);
      syncSpeak();
    },
    onLevel,
    onDone({ url }) {
      if (P !== owner) { if (url) URL.revokeObjectURL(url); return; }
      P.recUrl = url;
      P.mic = url ? "recorded" : "measured";
      syncSpeak();

    onError(code) {

function stopMic() {

function stopPlayback() {

  }

function clearRecording() {
  if (P && P.recUrl) { URL.revokeObjectURL(P.recUrl); P.recUrl = null; }
}
function togglePlayback() {
  if (!P || !P.recUrl) return;
  if (P.playing) { stopPlayback(); return; }
  Speech.cancel();
  const owner = P;
  const audio = new Audio(P.recUrl);
  const finish = () => {
    if (P !== owner || P.audio !== audio) return;
    P.audio = null; P.playing = false; syncSpeak();
  };
  audio.onended = finish;
  audio.onerror = () => { finish(); toast("Không phát lại được bản ghi. Hãy thử ghi lại."); };
  P.audio = audio; P.playing = true;
  syncSpeak();

/* Hàng đợi: từ chưa nhớ lên đầu (sai nhiều xếp trước), rồi đến từ mới */

/* --- So sánh từng từ để tô màu từ cần sửa --- */
function wordTokens(text) {
  return String(text).trim().split(/\s+/).filter(Boolean).map((raw) => ({ raw, parts: normalizeSpeech(raw) }));
}
/* Căn hai câu theo từ (dãy con chung dài nhất); từ gần đúng chính tả vẫn tính là khớp */
function diffSentence(targetText, heardText) {
  const target = wordTokens(targetText), heard = wordTokens(heardText);
  const a = target.flatMap((t, i) => t.parts.map((w) => ({ w, owner: i })));
  const b = heard.flatMap((t, i) => t.parts.map((w) => ({ w, owner: i })));
  const same = (x, y) => x === y || (Math.max(x.length, y.length) > 3 && wordCost(x, y) <= 0.25);
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = b.length - 1; j >= 0; j--) {
      dp[i][j] = same(a[i].w, b[j].w) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const aOk = new Set(), bOk = new Set();
  for (let i = 0, j = 0; i < a.length && j < b.length;) {
    if (same(a[i].w, b[j].w)) { aOk.add(i); bOk.add(j); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else j++;
  }
  const mark = (tokens, flat, ok) => tokens.map((t, idx) => {
    const own = flat.map((x, k) => (x.owner === idx ? k : -1)).filter((k) => k >= 0);
    return { raw: t.raw, ok: own.length > 0 ? own.every((k) => ok.has(k)) : true };
  });
  return { target: mark(target, a, aOk), heard: mark(heard, b, bOk) };
}
const wordsHtml = (list) => list.map((w) => `<span class="${w.ok ? "w-ok" : "w-bad"}">${esc(w.raw)}</span>`).join(" ");
/* Khối đối chiếu dùng cho luyện câu và hội thoại */
function compareHtml(targetText, heardText, withVoice) {
  const d = diffSentence(targetText, heardText);
  return `<div class="card compare">
    <div><b>Mình nghe được</b><span lang="en">${wordsHtml(d.heard)}</span></div>
    <div><b>Câu chuẩn</b><span lang="en">${wordsHtml(d.target)}</span></div>
    <p class="small muted">Từ gạch chân màu đỏ là từ cần nói lại.</p>
    ${withVoice ? `<button class="btn btn-soft btn-block" data-act="playVoice">${ic("play")}Nghe lại giọng bạn</button>` : ""}
  </div>`;
}
/* Nghe lại giọng vừa nói; nghe xong app tự bật micro lại */
function playVoice() {
  if (!P || !P.voiceUrl) return;
  interrupt();
  const owner = P;
  const audio = new Audio(P.voiceUrl);
  const finish = () => {
    if (P !== owner || P.voiceAudio !== audio) return;
    P.voiceAudio = null;
    if (P.phase !== "paused" && !P.solved) goListen();
  };
  P.voiceAudio = audio;
  audio.onended = finish;
  audio.onerror = () => { finish(); toast("Không phát lại được bản ghi."); };
  const started = audio.play();
  if (started && started.catch) started.catch(finish);
}

function dSetPhase(phase) { if (D) { D.phase = phase; drawDialog(); } }
async function dStart() {
  if (!D) return;
  dStop();
  if (!Recog.supported) { dNext(); return; }
  const owner = D, run = D.run;
  if (!micReady) dSetPhase("perm");
  try { await ensureMic(); }
  catch (code) { if (D === owner && D.run === run) { D.errCode = code; dSetPhase("error"); } return; }
  if (D === owner && D.run === run) dNext();
}
/* Sang lượt kế tiếp: đối phương thì phát giọng rồi tự đi tiếp, người học thì bật micro */
function dNext() {
  if (!D) return;
  dStop();
  D.pos++;
  D.feedback = null; D.interim = ""; D.note = null; D.silent = 0; D.tries = 0;
  const line = D.d.lines[D.pos];
  if (!line) { dFinish(); return; }
  if (line.speaker === "app") dSpeakApp(line);
  else dUserTurn(line);
}
function dSpeakApp(line) {
  dSetPhase("app");
  const owner = D, run = D.run;
  Speech.speak(line.en, SPEEDS[state.speed].rate).then((r) => {
    if (D !== owner || D.run !== run || r === "canceled") return;
    if (r === "error") { D.note = SPEECH_FAILED; }
    dLater(dNext, r === "ended" ? 300 : 1800);
  });
}
function dUserTurn() {
  if (!Recog.supported || D.useManual) { dSetPhase("manual"); return; }
  dListen();
}
function dListen() {
  if (!D) return;
  dStop();
  markActive();
  D.interim = ""; D.nudge = false;
  dSetPhase("turn");
  dLater(() => { D.nudge = true; drawDialog(); }, SILENCE_NUDGE_MS);
  const owner = D, run = D.run, line = D.d.lines[D.pos];
  const stale = () => D !== owner || D.run !== run;
  let endReason = null;
  Recog.start({
    onSpeech() { if (stale()) return; markActive(); D.nudge = false; if (D.phase === "turn") dSetPhase("listening"); },
    onInterim(text) {
      if (stale()) return;
      D.interim = text; D.feedback = null; D.nudge = false;
      if (D.phase !== "listening") dSetPhase("listening");
      else { const el = $("#dInterim"); if (el) el.textContent = text; }
    },
    onFinal(alts) { if (!stale()) dJudge(alts, line); },
    onError(code) {
      if (stale()) return;
      if (code === "no-speech") { endReason = "silent"; return; }
      const map = { "not-allowed": "denied", "service-not-allowed": "service", "audio-capture": "nomic", network: "network", "language-not-supported": "service", "start-failed": "unknown" };
      if (code === "not-allowed") micReady = false;

    },
    onEnd() {
      if (stale()) return;
      if (D.interim) { D.note = "Mình chưa nghe rõ, hãy thử lại"; dLater(dListen, 900); drawDialog(); return; }

function dJudge(alts, line) {
  const rank = { wrong: 0, near: 1, correct: 2 };
  let best = null;
  alts.forEach((text) => {
    const g = gradeSpeech(text, line);
    if (!best || rank[g.level] > rank[best.level] || (rank[g.level] === rank[best.level] && g.score > best.score)) best = { ...g, heard: text.trim() };
  });
  dStop();
  D.note = null; D.interim = ""; D.silent = 0;
  if (!best || !best.heard) { D.note = "Mình chưa nghe rõ, hãy thử lại"; dLater(dListen, 900); drawDialog(); return; }
  D.tries++;
  practiceSessionReps++;
  if (best.level === "correct") {
    D.feedback = null;
    vibrate(20);
    dSetPhase("good");
    dLater(dNext, 800);
    return;
  }
  D.feedback = best.heard;
  dSetPhase(best.level);
  dLater(dListen, best.level === "near" ? 2000 : 2800);
}

}

function b64ToBytes(s) {
  const raw = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));

  return { supported: true, on: list.length > 0, hour: list[0] ? list[0].remind_hour : 20, sub };

async function reminderOn(hour) {

  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY) });
  const j = sub.toJSON();
  await rows(sb.from("push_subscriptions").upsert({ endpoint: j.endpoint, user_id: me.id, p256dh: j.keys.p256dh, auth: j.keys.auth, remind_hour: hour }).select("endpoint"));
  return true;
}

function reminderSection(r) {

      : `<p class="small muted" style="text-align:center">Quên mật khẩu? Hãy nhờ người quản lý ứng dụng đặt lại giúp bạn.</p>`}
  </div>`;
  $("#authForm").addEventListener("submit", submitAuth);

async function submitAuth(e) {
  e.preventDefault();
  const username = $("#fUser").value.trim().toLowerCase();
  const password = $("#fPass").value;
  const name = $("#fName") ? $("#fName").value.trim() : "";
  const show = (m) => { $("#authMsg").innerHTML = `<div class="notice notice-bad">${ic("warn")}<div>${esc(m)}</div></div>`; };
  if (!/^[a-z0-9_.]{3,20}$/.test(username)) return show("Tên đăng nhập cần 3–20 ký tự: chữ thường không dấu, số, dấu _ hoặc dấu chấm.");
  if (password.length < 6) return show("Mật khẩu cần tối thiểu 6 ký tự.");
  if (authMode === "signup" && name && name.length < 2) return show("Tên hiển thị cần tối thiểu 2 ký tự.");
  const btn = $("#authBtn");
  btn.disabled = true;
  btn.textContent = "Đang xử lý…";
  const email = usernameToEmail(username);
  const { error } = authMode === "signup"
    ? await sb.auth.signUp({ email, password, options: { data: { username, display_name: name || username } } })
    : await sb.auth.signInWithPassword({ email, password });
  if (!error) return;
  btn.disabled = false;
  btn.textContent = authMode === "signup" ? "Tạo tài khoản" : "Đăng nhập";
  const m = error.message || "";
  if (/already registered/i.test(m)) show("Tên đăng nhập này đã có người dùng. Hãy chọn tên khác.");
  else if (/invalid login/i.test(m)) show("Sai tên đăng nhập hoặc mật khẩu.");
  else if (/rate limit|too many/i.test(m)) show("Thử quá nhiều lần. Hãy đợi một lúc rồi thử lại.");
  else if (/weak|password/i.test(m)) show("Mật khẩu chưa đủ mạnh. Hãy chọn mật khẩu khác.");
  else show(errorText(error));
}

function chart7Days(sessions, goalMin) {
  const byDay = Object.fromEntries(sessions.map((s) => [s.day, s]));
  const names = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  const days = [];
  for (let n = 6; n >= 0; n--) {
    const d = daysAgo(n);
    const r = byDay[dateKey(d)] || { seconds: 0, attempts: 0 };
    days.push({ name: n === 0 ? "Nay" : names[d.getDay()], full: `${d.getDate()}/${d.getMonth() + 1}`, min: r.seconds / 60, reps: r.attempts, today: n === 0 });
  }
  const top = Math.max(goalMin, ...days.map((d) => d.min));
  const pct = (v) => v / top * 100;
  return `<div class="chart" aria-hidden="true">
      <div class="goal-line" style="bottom:calc(24px + (100% - 24px) * ${pct(goalMin) / 100})"><span>Mục tiêu ${goalMin} phút</span></div>
      ${days.map((d) => `<div class="col ${d.today ? "today" : ""}" tabindex="0">
          <span class="tip">${d.full}: ${Math.round(d.min)} phút · ${d.reps} lần nói</span>
          ${d.today && d.min > 0 ? `<span class="val">${Math.round(d.min)}</span>` : ""}
          <div class="fill ${d.min > 0 ? "" : "zero"}" style="height:${Math.max(pct(d.min), d.min > 0 ? 2 : 0)}%"></div>
          <span class="lb">${d.name}</span>
        </div>`).join("")}
    </div>
    <table class="sr"><caption>Thời gian học 7 ngày gần nhất</caption>
      <tr><th>Ngày</th><th>Số phút</th><th>Số lần nói</th></tr>
      ${days.map((d) => `<tr><td>${d.full}</td><td>${Math.round(d.min)}</td><td>${d.reps}</td></tr>`).join("")}
    </table>`;
}

function renderFinish(topicId) {
  const t = topicById(topicId);
  if (!t) { view.innerHTML = notFound(); return; }
  if (!topicUnlocked(t)) { location.replace(`#/level/${t.level_id}`); return; }
  page(loadProgress, () => {
    const done = doneInTopic(t), known = knownInTopic(t);
    const res = topicRows[t.id];
    const recs = t.sentences.map((_, i) => spOf(t.id, i)).filter(Boolean);
    const attempts = recs.reduce((n, r) => n + (r.attempts || 0), 0);
    const graded = recs.filter((r) => r.firstResult && r.firstResult !== "manual");
    const firstRate = graded.length ? Math.round(graded.filter((r) => r.firstResult === "correct").length / graded.length * 100) : null;
    const review = reviewList(t);
    const open = t.sentences.findIndex((_, i) => isOpen(t.id, i));
    const speakOk = done === t.sentences.length, wordOk = known >= wordsNeeded(t), testOk = !!(res && res.test_passed);
    const step = (ok, n, title, sub, href, cta, next) => `<section class="card row">
      <span class="step-no ${ok ? "ok" : ""}">${ok ? ic("check") : n}</span>
      <span style="flex:1;min-width:0"><b>${title}</b><br><span class="small muted">${sub}</span></span>
      <a class="btn ${next ? "btn-primary" : "btn-ghost"}" href="${href}">${cta}</a></section>`;
    const nextStep = !speakOk ? 1 : !wordOk ? 2 : !testOk ? 3 : 0;
    view.innerHTML = `<div class="screen stack fc-wrap">
      ${pageHead(`${t.icon} ${t.title_vi}`, t.goal_vi, `#/level/${t.level_id}`)}
      ${topicComplete(t) ? `<div class="notice notice-good">${ic("check")}<div><b>Bạn đã hoàn thành chủ đề này!</b>Bạn vẫn có thể ôn lại bất cứ lúc nào.</div></div>` : ""}
      ${step(speakOk, 1, "Luyện nói", `${done}/${t.sentences.length} câu`, open >= 0 ? `#/practice/${t.id}/${open}` : `#/practice/${t.id}/0/all`, speakOk ? "Ôn" : "Học", nextStep === 1)}
      ${step(wordOk, 2, "Từ vựng", `Đã nhớ ${known}/${t.words.length}, cần ${wordsNeeded(t)}`, `#/vocab/${t.id}`, wordOk ? "Ôn" : "Học", nextStep === 2)}
      ${step(testOk, 3, "Bài kiểm tra", res ? `Điểm cao nhất ${res.best_score}%, cần 80%` : "Cần đạt từ 80%", `#/quiz/topic/${t.id}`, testOk ? "Làm lại" : "Làm bài", nextStep === 3)}
      ${t.dialogue ? `<a class="card challenge-link" href="#/dialog/${t.id}"><span class="ico">🎭</span><span class="grow"><b>Hội thoại đóng vai</b><br><span class="muted small">${esc(t.dialogue.title_vi)} · Không bắt buộc${dialogueDone[t.dialogue.id] ? " · Đã làm " + dialogueDone[t.dialogue.id] + " lần" : ""}</span></span>${ic("next")}</a>` : ""}

let Q = null;
function renderQuiz(scope, ref) {
  const isTopic = scope === "topic";
  const t = isTopic ? topicById(ref) : null;
  const lv = isTopic ? null : levelById(parseInt(ref, 10));
  if ((isTopic && !t) || (!isTopic && !lv)) { view.innerHTML = notFound(); return; }
  page(async () => {
    let query = sb.from("quiz_questions").select("*").order("position");
    query = isTopic ? query.eq("topic_id", ref) : query.eq("level_id", lv.id);
    return rows(query);
  }, (questions) => {
    if (!questions.length) { view.innerHTML = `<div class="card empty">${esc(ERROR_TEXT.NO_QUESTIONS)}</div>`; return; }
    Q = { isTopic, t, lv, questions, pos: 0, answers: {}, title: isTopic ? t.title_vi : lv.code, back: isTopic ? `#/topic/${t.id}` : `#/level/${lv.id}` };
    drawQuiz();
  });
}
function drawQuiz() {
  const q = Q.questions[Q.pos];
  const chosen = Q.answers[q.id];
  const last = Q.pos === Q.questions.length - 1;
  view.innerHTML = `<div class="screen fc-wrap">
    <header class="pr-head"><a class="icon-btn" href="${Q.back}" aria-label="Thoát bài kiểm tra">${ic("x")}</a>
      <div class="mid"><p class="tn">${esc(Q.title)}</p><b>Câu ${Q.pos + 1}/${Q.questions.length}</b></div><span style="width:48px"></span></header>
    <div style="margin-bottom:16px">${bar(Math.round((Q.pos + 1) / Q.questions.length * 100))}</div>
    <div class="stack" style="padding-bottom:110px">
      <p class="subtitle" style="font-size:1.25rem">${esc(q.prompt)}</p>
      ${q.audio_text ? `<button class="btn btn-soft btn-lg btn-block" data-act="say" data-text="${esc(q.audio_text)}"><span data-icon>${ic("play")}</span><span data-label>Nghe câu hỏi</span></button>` : ""}
      <div class="stack" style="gap:8px" role="group" aria-label="Các lựa chọn">
        ${q.options.map((o) => `<button class="choice" data-act="quizPick" data-value="${esc(o)}" aria-pressed="${chosen === o}"><span style="flex:1;min-width:0">${esc(o)}</span>${chosen === o ? ic("check") : ""}</button>`).join("")}
      </div>
      <div id="quizMsg" role="alert"></div>
    </div>
    <div class="dock dock-simple"><div class="dock-in"><div class="two">
      <button class="btn btn-ghost" data-act="quizPrev" ${Q.pos === 0 ? "disabled" : ""} style="min-height:56px">${ic("back")}Câu trước</button>
      <button class="btn btn-primary" id="quizNext" data-act="${last ? "quizSubmit" : "quizNext"}" ${chosen ? "" : "disabled"} style="min-height:56px">${last ? "Nộp bài" : "Câu tiếp"}${last ? "" : ic("next")}</button>
    </div></div></div></div>`;
}
async function submitQuiz() {
  const btn = $("#quizNext");
  btn.disabled = true;
  btn.textContent = "Đang chấm…";
  try {
    await Outbox.flush();
    const r = await rpc("submit_quiz", { p_topic: Q.isTopic ? Q.t.id : null, p_level: Q.isTopic ? null : Q.lv.id, p_answers: Q.answers });
    const unlockedBefore = { ...levelRows };
    await loadProgress();
    drawQuizResult(r, unlockedBefore);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Nộp bài";
    $("#quizMsg").innerHTML = `<div class="notice notice-bad">${ic("warn")}<div>${esc(errorText(e))}</div></div>`;
  }
}
function drawQuizResult(r, before) {
  const wrong = r.review.map((x) => ({ q: Q.questions.find((q) => q.id === x.id), answer: x.answer })).filter((x) => x.q)
    .sort((a, b) => a.q.position - b.q.position);
  const levelPassed = !Q.isTopic && r.passed;
  const nextLv = levelPassed ? LEVELS.find((l) => l.id > Q.lv.id) : null;
  const newlyOpen = nextLv && !before[nextLv.id] && levelRows[nextLv.id];
  if (r.passed) { confetti(); vibrate([30, 40, 30]); }
  view.innerHTML = `<div class="screen stack fc-wrap" style="padding-top:8px">
    <div class="empty" style="padding:18px 8px 4px">
      <div class="big">${levelPassed ? "🏅" : r.passed ? "🎉" : "💪"}</div>
      <h1 class="title">${levelPassed ? `Chúc mừng bạn đã vượt ${esc(Q.lv.code)}!` : r.passed ? "Bạn đã đạt!" : "Gần tới rồi, thử lại nhé"}</h1>
      <p class="score">${r.score}%</p>
      <p class="muted">Đúng ${r.correct}/${r.total} câu · Cần từ 80%</p>
    </div>
    ${newlyOpen ? `<div class="notice notice-good">${ic("check")}<div><b>Đã mở khóa ${esc(nextLv.code)}</b>${esc(nextLv.title_vi)}</div></div>` : ""}
    ${wrong.length ? `<section class="card stack" style="gap:8px"><p class="subtitle">Câu cần xem lại</p>${wrong.map(({ q, answer }) => `<div class="review-q">
        <p class="small">${esc(q.prompt)}</p>
        <p class="small"><span class="w-bad">Bạn chọn: ${esc(Q.answers[q.id] || "Chưa chọn")}</span></p>
        <p class="small"><b class="w-ok">${ic("check")} Đáp án đúng: ${esc(answer)}</b></p>
        ${q.audio_text ? `<button class="btn btn-soft" data-act="say" data-text="${esc(q.audio_text)}"><span data-icon>${ic("play")}</span><span data-label>Nghe lại</span></button>` : ""}
      </div>`).join("")}</section>` : ""}
    ${r.passed ? "" : `<a class="btn btn-primary btn-lg btn-block" href="${Q.back}" data-act="quizRetry">${ic("redo")}Làm lại</a>`}
    ${newlyOpen ? `<a class="btn btn-primary btn-lg btn-block" href="#/level/${nextLv.id}">${ic("next")}Vào ${esc(nextLv.code)}</a>` : `<a class="btn ${r.passed ? "btn-primary" : "btn-ghost"} btn-block" href="${Q.back}">${r.passed ? "Tiếp tục" : "Quay lại ôn tập"}</a>`}
  </div>`;
}

async function noticeText(n) {

function noticeLine(n, name) {
  const pl = n.payload || {};
  if (n.kind === "friend_request") return `${name} muốn kết bạn với bạn.`;
  if (n.kind === "friend_accepted") return `${name} đã đồng ý kết bạn.`;

    return `${name} vừa đạt: ${a ? a.title_vi : "thành tích mới"} 🎉`;

  return `${name} có cập nhật mới.`;
}

/* Thử lại sau lỗi hội thoại: tiếp tục đúng lượt đang dở thay vì bắt đầu lại */
async function dStart2() {
  if (!D) return;
  if (D.pos < 0) { dStart(); return; }
  const owner = D, run = ++D.run;
  try { await ensureMic(); }
  catch (code) { if (D === owner && D.run === run) { D.errCode = code; dSetPhase("error"); } return; }
  if (D === owner && D.run === run) dUserOrNext();
}
function dUserOrNext() {
  const line = D.d.lines[D.pos];
  if (line && line.speaker === "user") dUserTurn(); else dNext();
}
const quickAct = (fn) => async (el) => {
  el.disabled = true;
  try { await fn(el); } catch (e) { toast(errorText(e)); el.disabled = false; }
};
const Actions = {
  say(el) { sayFromButton(el, el.dataset.text, SPEEDS.normal.rate); },
  closeSheet() { closeSheet(); },
  retryRoute() { route(); },
  authMode(el) { authMode = el.dataset.mode; renderAuth(); },
  logout: quickAct(async () => {
    await Outbox.flush();
    await sb.auth.signOut();
  }),

  /* Luyện câu */
  startLesson, playModel, goListen,
  retryLesson() { micReady = false; startLesson(); },
  pauseLesson, skipSentence, playVoice,
  setSpeed(el) {
    state.speed = el.dataset.speed;
    save();
    syncSpeed();
    if (P && P.phase === "model") playModel();
  },
  toggleVi() { state.showVi = !state.showVi; save(); syncVi(); },
  useManual() { if (P) { Recog.stop(); P.forceManual = manualPreferred = true; renderManualMode(); } },
  manualDone,
  startMic, stopMic,
  playback: togglePlayback,
  pickSentence() { if (P) { pauseIfActive(); openPicker(); } },
  jumpSentence(el) { closeSheet(); gotoSentence(parseInt(el.dataset.i, 10)); },
  guide() { pauseIfActive(); openGuide(); },

  /* Hội thoại */
  dStart,
  dResume() { if (D) { const line = D.d.lines[D.pos]; if (!line) dStart(); else if (line.speaker === "app") dSpeakApp(line); else dUserTurn(); } },
  dRetry() { micReady = false; dStart2(); },
  dUseManual() { if (D) { D.useManual = true; dStop(); dUserOrNext(); } },
  dListen,
  dPause() { if (D) { dStop(); dSetPhase("paused"); } },
  dManual() { if (D) dNext(); },
  dSkip() { if (D) { D.skipped++; dNext(); } },
  dReplay() {
    if (!D) return;
    dStop();
    // Phát lại câu gần nhất của đối phương; xong thì quay lại lượt hiện tại
    const shown = D.d.lines.slice(0, D.pos + 1).filter((l) => l.speaker === "app");
    const last = shown[shown.length - 1];
    if (!last) { dListen(); return; }
    dSetPhase("app");
    const owner = D, run = D.run;
    Speech.speak(last.en, SPEEDS[state.speed].rate).then((r) => {
      if (D !== owner || D.run !== run || r === "canceled") return;
      const line = D.d.lines[D.pos];
      if (line.speaker === "app") dLater(dNext, 300); else dLater(dUserTurn, 300);
    });
  },
  dToggleEn() { if (D) { D.hideEn = !D.hideEn; drawDialog(); } },
  dAgain() { if (D) { const hide = true; renderDialog(D.t.id); D.hideEn = hide; drawDialog(); } },
  async installApp() {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null;
    renderSettings();
  },

  /* Từ vựng */
  flip: flipCard,
  rateKnown() { rateWord(true); },
  rateAgain() { rateWord(false); },
  vocabRestart() {
    if (!V) return;
    const fresh = buildQueue(V.items);
    const rest = V.items.filter((x) => !fresh.includes(x));
    V.queue = [...fresh, ...rest];
    drawVocab();
  },

  /* Kiểm tra */
  quizPick(el) { Q.answers[Q.questions[Q.pos].id] = el.dataset.value; drawQuiz(); },
  quizNext() { if (Q.pos < Q.questions.length - 1) { Q.pos++; Speech.cancel(); drawQuiz(); window.scrollTo(0, 0); } },
  quizPrev() { if (Q.pos > 0) { Q.pos--; Speech.cancel(); drawQuiz(); } },
  quizSubmit: submitQuiz,
  quizRetry() { Q.pos = 0; Q.answers = {}; },

  /* Bạn bè */
  friendAdd: quickAct(async (el) => {
    const r = await rpc("send_friend_request", { p_to: el.dataset.id });
    el.textContent = r === "accepted" || r === "already_friends" ? "Đã là bạn" : "Đã gửi";
    if (r === "accepted") toast("Hai bạn đã kết bạn!");
  }),
  friendRespond: quickAct(async (el) => {
    await rpc("respond_friend_request", { p_request: el.dataset.id, p_accept: el.dataset.accept === "1" });
    renderFriends();
  }),
  friendCancel: quickAct(async (el) => {
    await rows(sb.from("friend_requests").update({ status: "cancelled" }).eq("id", el.dataset.id));
    renderFriends();
  }),
  cheer: quickAct(async (el) => {
    await rpc("send_cheer", { p_friend: el.dataset.id, p_message: el.dataset.m });
    toast("Đã gửi lời động viên!");
    el.disabled = false;
  }),
  goalCreate: quickAct(async (el) => {
    await rpc("create_shared_goal", { p_friend: el.dataset.id, p_days: 5 });
    toast("Đã tạo mục tiêu chung!");
    location.hash = "#/rank";
  }),
  askUnfriend(el) {
    const id = el.dataset.id;
    $("#unfriendBox").innerHTML = `<div class="notice notice-warn">${ic("warn")}<div>Hủy kết bạn? Hai bạn sẽ không còn xem được tiến độ của nhau.</div></div>
      <div class="two" style="margin-top:10px"><a class="btn btn-ghost" href="#/friend/${id}" data-act="retryRoute">Giữ lại</a><button class="btn btn-danger" data-act="unfriend" data-id="${id}">Hủy kết bạn</button></div>`;
  },
  unfriend: quickAct(async (el) => {
    await rpc("remove_friend", { p_other: el.dataset.id });
    toast("Đã hủy kết bạn.");
    location.hash = "#/friends";
  }),

  /* Cá nhân */
  pickAvatar: quickAct(async (el) => {
    await rows(sb.from("profiles").update({ avatar_url: el.dataset.a }).eq("id", me.id).select("id"));
    me.avatar_url = el.dataset.a;
    renderMe();
  }),
  setGoal: quickAct(async (el) => {
    const m = parseInt(el.dataset.min, 10);
    await rows(sb.from("profiles").update({ daily_goal_min: m }).eq("id", me.id).select("id"));
    me.daily_goal_min = m;
    renderSettings();
  }),
  setScale(el) { state.scale = el.dataset.scale; applyScale(); save(); renderSettings(); }
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
